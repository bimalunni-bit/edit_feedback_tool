<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Timeline Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .left-column {
            width: 65%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .right-column {
            width: 35%;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-left: 1px solid #ccc;
            overflow: hidden;
        }

        .sidebar-header {
            flex-shrink: 0;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar-duration {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-duration .label { color: #666; }
        .sidebar-duration .value { color: #333; }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f8f8f8;
            cursor: pointer;
            color: #333;
        }

        .filter-btn:hover {
            background: #eee;
        }

        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .segment-divider {
            font-size: 11px;
            color: #888;
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            margin-top: 8px;
            background: #fafafa;
        }

        .segment-divider:first-child { margin-top: 0; }

        .annotation-row {
            display: flex;
            align-items: stretch;
            min-height: 72px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #fff;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .annotation-row:hover { background: #f8f9fa; }
        .annotation-row.highlighted { box-shadow: 0 0 0 2px #007bff; background: #e7f1ff; }
        .annotation-row.pulsing { animation: pulse 0.6s ease-out; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 4px rgba(0,123,255,0.6); }
            100% { box-shadow: none; }
        }

        .annotation-row.completed {
            background: #e8e8e8 !important;
            color: #666;
            opacity: 0.85;
        }

        .annotation-row.completed .annotation-timecode,
        .annotation-row.completed .annotation-type { color: #666; }

        .annotation-colour-bar {
            width: 4px;
            border-radius: 4px 0 0 4px;
            flex-shrink: 0;
        }

        .annotation-colour-bar.delete { background: #dc3545; }
        .annotation-colour-bar.addition { background: #007bff; }
        .annotation-colour-bar.swap { background: #fd7e14; }
        .annotation-colour-bar.video { background: #6f42c1; }
        .annotation-colour-bar.audio { background: #20c997; }
        .annotation-colour-bar.text { background: #e83e8c; }
        .annotation-colour-bar.general { background: #6c757d; }

        .annotation-content {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .annotation-top-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .annotation-timecode { font-weight: bold; font-size: 13px; color: #333; }
        .annotation-type { font-size: 12px; color: #666; margin-left: 4px; }
        .annotation-segment { font-size: 11px; color: #888; margin-left: auto; }
        .annotation-comment { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .annotation-reply-block { font-size: 11px; color: #555; padding: 6px; background: #f0f0f0; border-radius: 4px; margin-top: 4px; display: none; }
        .annotation-reply-block.visible { display: block; }

        .annotation-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #eee;
        }

        .annotation-controls button {
            padding: 4px 10px;
            font-size: 11px;
            margin: 0;
        }

        .annotation-controls .edit-btn { background: #6c757d; }
        .annotation-controls .edit-btn:hover { background: #5a6268; }
        .annotation-controls .remove-btn { background: #dc3545; }
        .annotation-controls .remove-btn:hover { background: #c82333; }
        .annotation-controls input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .annotation-controls label { font-size: 11px; font-weight: normal; margin: 0; cursor: pointer; }
        .reply-icon { cursor: pointer; font-size: 14px; margin-left: auto; color: #007bff; }
        .completed-check { color: #28a745; font-size: 14px; margin-left: 4px; }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: fit-content;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #004085;
        }

        .timeline-view-controls {
            margin-top: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle-btn {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .view-toggle-btn:hover {
            background-color: #218838;
        }

        .view-toggle-btn.overview {
            background-color: #6c757d;
        }

        .view-toggle-btn.overview:hover {
            background-color: #5a6268;
        }

        .timeline-container {
            position: relative;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            overflow: hidden;
            padding: 20px;
        }

        /* Scrollable content only; overlay stays fixed so cursor is always visible */
        .timeline-scrollable {
            overflow-x: auto;
            overflow-y: visible;
            margin-top: 32px;
        }

        /* Viewport-fixed overlay: label zone above + bar zone; cursor line drawn only in bar zone */
        .timeline-cursor-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 92px;
            pointer-events: none;
            z-index: 25;
        }
        .timeline-cursor-overlay.range-dragging {
            z-index: 35;
        }

        .timeline-container.collapsed .timeline-scrollable {
            overflow-x: hidden;
        }
        .timeline-scrollable.range-dragging {
            z-index: 30;
            position: relative;
        }

        .timeline-wrapper {
            position: relative;
            min-width: 100%;
        }

        .timeline-bar-container {
            position: relative;
            margin-bottom: 30px;
        }
        .timeline-bar-container.range-dragging {
            z-index: 30;
        }

        .cursor-timecode {
            position: absolute;
            top: 4px;
            left: 0;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            pointer-events: none;
            transform: translateX(-50%);
            white-space: nowrap;
            display: none;
            z-index: 30;
        }

        .cursor-line {
            position: absolute;
            top: 32px;
            width: 2px;
            height: 60px;
            background-color: #007bff;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* Range drag labels in overlay: always on top, solid background, visible for entire drag */
        .range-overlay-timecode {
            position: absolute;
            top: 4px;
            left: 0;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            pointer-events: none;
            transform: translateX(-50%);
            white-space: nowrap;
            display: none;
            z-index: 35;
        }

        /* DEBUG: thick red border to see #timelineBar boundaries - remove when done */
        #timelineBar {
            border: 4px solid red !important;
        }
        .timeline-bar {
            box-sizing: border-box;
            height: 60px;
            min-width: 0;
            max-width: none;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
            border: 2px solid #333;
            border-radius: 4px;
            position: relative;
            cursor: crosshair;
            z-index: 5;
            pointer-events: auto;
            /* width set by JS via setTimelineBarAndMarkersWidth() */
        }

        .compressed-timeline-background {
            position: absolute;
            top: 0;
            left: 0;
            height: 60px;
            pointer-events: none;
            z-index: 1;
        }

        .timeline-segment {
            position: absolute;
            top: 0;
            height: 60px;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
        }

        .timeline-gap {
            position: absolute;
            top: 0;
            height: 60px;
            background: repeating-linear-gradient(
                45deg,
                rgba(220, 53, 69, 0.1),
                rgba(220, 53, 69, 0.1) 5px,
                rgba(220, 53, 69, 0.05) 5px,
                rgba(220, 53, 69, 0.05) 10px
            );
            border-left: 1px solid rgba(220, 53, 69, 0.3);
            border-right: 1px solid rgba(220, 53, 69, 0.3);
        }

        /* DEBUG: thick blue border to see #timeMarkers boundaries - remove when done */
        #timeMarkers {
            border: 4px solid blue !important;
        }
        .time-markers {
            position: relative;
            height: 30px;
            min-width: 0;
            max-width: none;
            border-top: 1px solid #ccc;
            overflow: hidden;
            /* width set by JS via setTimelineBarAndMarkersWidth() */
        }

        .marker {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            text-align: center;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
        }
        .marker.marker-first {
            left: 0;
            width: auto;
            transform: none;
            text-align: left;
            overflow: hidden;
        }
        .marker.marker-first .marker-label {
            text-align: left;
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }
        .marker.marker-last {
            transform: translateX(-100%);
            text-align: right;
            max-width: 100%;
            overflow: hidden;
        }
        .marker.marker-last .marker-label {
            text-align: right;
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }

        .marker-line {
            width: 1px;
            height: 10px;
            background-color: #666;
            margin: 0 auto;
        }
        .marker.marker-first .marker-line {
            margin-left: 0;
            margin-right: auto;
        }
        .marker.marker-last .marker-line {
            margin-left: auto;
            margin-right: 0;
        }

        .marker-label {
            display: inline-block;
            font-size: 11px;
            color: #333;
            margin: 2px 0 0 0;
            padding: 0;
            white-space: nowrap;
            max-width: 100%;
            box-sizing: border-box;
        }

        .segment-marker {
            position: absolute;
            top: 0;
            width: 3px;
            height: 60px;
            background-color: #ff6b6b;
            cursor: pointer;
            z-index: 20;
            transform: translateX(-50%);
        }

        .segment-marker:hover {
            background-color: #ff5252;
            width: 4px;
        }

        .segment-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #ff6b6b;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #ff6b6b;
        }

        .duration-display {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .duration-item {
            display: flex;
            gap: 8px;
        }

        .duration-label {
            color: #666;
        }

        .duration-value {
            color: #333;
        }

        .range-selection {
            position: absolute;
            top: 0;
            height: 60px;
            background-color: rgba(0, 123, 255, 0.2);
            border-left: 2px solid #007bff;
            border-right: 2px solid #007bff;
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        .range-timecode {
            position: absolute;
            top: -28px;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            white-space: nowrap;
            pointer-events: none;
            transform: translateX(-50%);
            z-index: 30;
        }

        .delete-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 300px;
            display: none;
        }

        .delete-popup h3 {
            margin: 0 0 15px 0;
            color: #dc3545;
        }

        .delete-popup .timecode-display {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .delete-popup textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .delete-popup .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .delete-popup button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-popup .save-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-popup .save-btn:hover {
            background-color: #c82333;
        }

        .delete-popup .cancel-btn {
            background-color: #6c757d;
            color: white;
        }

        .delete-popup .cancel-btn:hover {
            background-color: #5a6268;
        }

        .deleted-zone {
            position: absolute;
            top: 0;
            width: 2px;
            height: 60px;
            background-color: #dc3545;
            cursor: pointer;
            z-index: 12;
            transform: translateX(-50%);
        }

        .deleted-zone:hover {
            width: 3px;
            background-color: #c82333;
        }

        .deleted-zone.highlighted,
        [data-deleted-region].highlighted {
            box-shadow: 0 0 0 2px #007bff;
            z-index: 14;
        }

        .deleted-chunks-strip {
            position: relative;
            height: 40px;
            margin-top: 10px;
            border-top: 1px solid #ccc;
            padding-top: 5px;
        }

        .deleted-chunk {
            position: absolute;
            height: 30px;
            background-color: #dc3545;
            border: 1px solid #c82333;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 10px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deleted-chunk:hover {
            background-color: #c82333;
        }

        .deleted-chunk-label {
            font-weight: bold;
            margin-right: 5px;
        }

        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            min-width: 400px;
            max-width: 600px;
            display: none;
        }

        .detail-panel h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .detail-panel .field {
            margin-bottom: 15px;
        }

        .detail-panel label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #666;
        }

        .detail-panel .timecode-field {
            font-family: monospace;
            font-size: 16px;
            color: #333;
        }

        .detail-panel .comment-field {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 60px;
            width: 100%;
            resize: vertical;
        }

        .detail-panel .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-panel .checkbox-field input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .detail-panel textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }

        .detail-panel .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .detail-panel button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .detail-panel .close-btn {
            background-color: #6c757d;
            color: white;
        }

        .detail-panel .close-btn:hover {
            background-color: #5a6268;
        }

        .duration-display { display: none; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="left-column">
            <div class="controls">
                <div class="control-group">
                    <label for="projectName">Project Name:</label>
                    <input type="text" id="projectName" placeholder="Enter project name">
                </div>
                <div class="control-group">
                    <label for="duration">Total Duration (hh:mm:ss):</label>
                    <input type="text" id="duration" placeholder="00:00:00" pattern="\d{2}:\d{2}:\d{2}">
                </div>
                <button onclick="drawTimeline()">Draw Timeline</button>
            </div>

            <div id="timelineViewControls" class="timeline-view-controls" style="display: none;">
                <button id="viewToggleBtn" class="view-toggle-btn" onclick="toggleTimelineView()">Overview</button>
            </div>

            <div id="timelineContainer" class="timeline-container" style="display: none;">
                <div id="timelineCursorOverlay" class="timeline-cursor-overlay">
                    <div id="cursorTimecode" class="cursor-timecode">00:00:00</div>
                    <div id="cursorLine" class="cursor-line"></div>
                    <div id="rangeOverlayIn" class="range-overlay-timecode">00:00:00</div>
                    <div id="rangeOverlayOut" class="range-overlay-timecode">00:00:00</div>
                </div>
                <div id="timelineScrollable" class="timeline-scrollable">
        <div class="timeline-wrapper">
            <div class="timeline-bar-container">
                <div id="rangeSelection" class="range-selection"></div>
                <div id="rangeStartTimecode" class="range-timecode"></div>
                <div id="rangeEndTimecode" class="range-timecode"></div>
                <div id="compressedTimelineBackground" class="compressed-timeline-background"></div>
                <div id="deletedZonesContainer"></div>
                <div id="segmentMarkersContainer"></div>
                <div id="timelineBar" class="timeline-bar"></div>
            </div>
            <div id="timeMarkers" class="time-markers"></div>
            <div id="deletedChunksStrip" class="deleted-chunks-strip"></div>
        </div>
                </div>
            </div>
        </div>

        <div id="sidebar" class="right-column" style="display: none; flex-direction: column;">
            <div class="sidebar-header">
                <div class="sidebar-duration">
                    <span class="label">Original:</span><span id="sidebarOriginalDuration" class="value">00:00:00</span>
                    <span class="label">Current:</span><span id="sidebarCurrentDuration" class="value">00:00:00</span>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="delete">Delete</button>
                    <button class="filter-btn" data-filter="addition">Addition</button>
                    <button class="filter-btn" data-filter="swap">Swap</button>
                    <button class="filter-btn" data-filter="video">Video</button>
                    <button class="filter-btn" data-filter="audio">Audio</button>
                    <button class="filter-btn" data-filter="text">Text & Graphics</button>
                    <button class="filter-btn" data-filter="general">General</button>
                </div>
            </div>
            <div id="sidebarList" class="sidebar-list"></div>
        </div>
    </div>

    <!-- Delete Annotation Popup -->
    <div id="deletePopup" class="delete-popup">
        <h3>Delete Annotation</h3>
        <div class="timecode-display">
            <div>In: <span id="popupInTimecode"></span></div>
            <div>Out: <span id="popupOutTimecode"></span></div>
        </div>
        <textarea id="deleteComment" placeholder="Enter comment..."></textarea>
        <div class="button-group">
            <button class="cancel-btn" onclick="closeDeletePopup()">Cancel</button>
            <button class="save-btn" onclick="saveDeleteAnnotation()">Save</button>
        </div>
    </div>

    <!-- Detail Panel -->
    <div id="detailPanel" class="detail-panel">
        <h3>Delete Annotation Details</h3>
        <div class="field">
            <label>In Timecode:</label>
            <div id="detailInTimecode" class="timecode-field"></div>
        </div>
        <div class="field">
            <label>Out Timecode:</label>
            <div id="detailOutTimecode" class="timecode-field"></div>
        </div>
        <div class="field">
            <label>Comment:</label>
            <div id="detailComment" class="comment-field"></div>
        </div>
        <div class="field checkbox-field">
            <input type="checkbox" id="detailCompleted">
            <label for="detailCompleted">Completed</label>
        </div>
        <div class="field">
            <label>Team Reply:</label>
            <textarea id="detailTeamReply" placeholder="Enter team reply..."></textarea>
        </div>
        <div class="button-group">
            <button class="close-btn" onclick="closeDetailPanel()">Close</button>
        </div>
    </div>

    <script>
        let timelineData = {
            totalSeconds: 0,
            actualWidth: 0,
            isExpanded: true
        };

        let segments = [];
        let segmentCounter = 1;
        let deleteAnnotations = [];
        let isSelectingRange = false;
        let rangeStartX = 0;
        let rangeStartTime = 0;
        let currentRangeEndX = 0;
        let currentRangeEndTime = 0;

        function parseDuration(durationStr) {
            const parts = durationStr.split(':').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) {
                throw new Error('Invalid duration format. Use hh:mm:ss');
            }
            return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function calculateMarkerInterval(totalSeconds) {
            // Calculate appropriate interval based on total duration
            // Aim for roughly 10-20 markers visible at a time
            const pixelsPerSecond = 10; // Base scale: 10 pixels per second
            const targetMarkers = 15;
            const baseInterval = totalSeconds / targetMarkers;
            
            // Round to nice intervals: 1s, 5s, 10s, 30s, 1m, 5m, 10m, 30m, 1h
            const intervals = [1, 5, 10, 30, 60, 300, 600, 1800, 3600];
            for (let interval of intervals) {
                if (interval >= baseInterval) {
                    return interval;
                }
            }
            return intervals[intervals.length - 1];
        }

        /** Set #timelineBar and #timeMarkers to the same pixel width in one place so they stay aligned. */
        function setTimelineBarAndMarkersWidth(widthPx) {
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');
            if (timelineBar) timelineBar.style.width = widthPx + 'px';
            if (timeMarkers) timeMarkers.style.width = widthPx + 'px';
        }

        function drawTimeline() {
            const durationInput = document.getElementById('duration').value.trim();
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');

            if (!durationInput) {
                alert('Please enter a duration');
                return;
            }

            try {
                const totalSeconds = parseDuration(durationInput);
                if (totalSeconds <= 0) {
                    alert('Duration must be greater than 0');
                    return;
                }

                // Calculate scale: 10 pixels per second
                const pixelsPerSecond = 10;
                const totalWidth = totalSeconds * pixelsPerSecond;
                const minWidth = 800; // Minimum width for short durations
                const actualWidth = Math.max(totalWidth, minWidth);

                setTimelineBarAndMarkersWidth(actualWidth);

                // Store timeline data for mouse tracking
                timelineData.totalSeconds = totalSeconds;
                timelineData.actualWidth = actualWidth;

                const scrollEl = document.getElementById('timelineScrollable');
                // Setup mouse tracking (will be updated when view changes)
                setupMouseTracking(timelineBar, container, scrollEl, totalSeconds, actualWidth);

                // Setup segment markers
                setupSegmentMarkers(timelineBar, totalSeconds, actualWidth);

                // Setup auto-scrolling (scrollable element so overlay stays fixed)
                setupAutoScroll(scrollEl);

                // Reset segments when redrawing timeline
                segments = [];
                segmentCounter = 1;
                document.getElementById('segmentMarkersContainer').innerHTML = '';

                // Calculate marker interval; always create first at 00:00:00 and last at total duration
                const markerInterval = calculateMarkerInterval(totalSeconds);

                // Clear existing markers (width already set above via setTimelineBarAndMarkersWidth)
                timeMarkers.innerHTML = '';

                function appendMarker(time, leftPx, isFirst, isLast) {
                    const marker = document.createElement('div');
                    marker.className = 'marker' + (isFirst ? ' marker-first' : '') + (isLast ? ' marker-last' : '');
                    marker.style.left = leftPx + 'px';
                    marker.dataset.originalLeft = String(leftPx);
                    const line = document.createElement('div');
                    line.className = 'marker-line';
                    const label = document.createElement('div');
                    label.className = 'marker-label';
                    label.textContent = formatTime(time);
                    marker.appendChild(line);
                    marker.appendChild(label);
                    timeMarkers.appendChild(marker);
                }

                // 1) First marker: exactly 00:00:00 at left edge
                appendMarker(0, 0, true, false);

                // 2) Intermediate markers: strict interval steps between 0 and totalSeconds (exclusive of both ends)
                for (let i = 1; i * markerInterval < totalSeconds; i++) {
                    const time = i * markerInterval;
                    const position = (time / totalSeconds) * actualWidth;
                    appendMarker(time, position, false, false);
                }

                // 3) Last marker: exactly total duration at right edge (always, even if it equals last interval step)
                appendMarker(totalSeconds, actualWidth, false, true);

                setTimeout(function() {
                    var bar = document.getElementById('timelineBar');
                    var markers = document.getElementById('timeMarkers');
                    console.log('[drawTimeline] after initial draw (before applyTimelineView): #timelineBar style.width=' + (bar ? bar.style.width : 'N/A') + ', offsetWidth=' + (bar ? bar.offsetWidth : 'N/A') + ' | #timeMarkers style.width=' + (markers ? markers.style.width : 'N/A') + ', offsetWidth=' + (markers ? markers.offsetWidth : 'N/A'));
                }, 0);

                // Reset delete annotations when redrawing
                deleteAnnotations = [];
                const deletedZonesContainer = document.getElementById('deletedZonesContainer');
                deletedZonesContainer.innerHTML = '';
                deletedZonesContainer.style.position = 'absolute';
                deletedZonesContainer.style.top = '0';
                deletedZonesContainer.style.left = '0';
                deletedZonesContainer.style.width = actualWidth + 'px';
                deletedZonesContainer.style.height = '60px';
                deletedZonesContainer.style.pointerEvents = 'none';
                document.getElementById('deletedChunksStrip').innerHTML = '';
                
                // Show container, controls, and sidebar
                container.style.display = 'block';
                document.getElementById('timelineViewControls').style.display = 'flex';
                document.getElementById('sidebar').style.display = 'flex';
                
                // Initialize duration display in sidebar
                updateDurationDisplay();
                
                // Setup range selection
                setupRangeSelection(timelineBar, totalSeconds, actualWidth);
                
                // Apply current view mode
                applyTimelineView();
            } catch (error) {
                alert(error.message);
            }
        }

        function toggleTimelineView() {
            timelineData.isExpanded = !timelineData.isExpanded;
            applyTimelineView();
        }

        function applyTimelineView() {
            const container = document.getElementById('timelineContainer');
            const toggleBtn = document.getElementById('viewToggleBtn');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const wrapper = document.querySelector('.timeline-wrapper');
            
            if (!timelineData.totalSeconds || !timelineData.actualWidth) {
                return; // Timeline not drawn yet
            }

            if (timelineData.isExpanded) {
                // Expanded view - use display width (collapsed to current duration when deletes exist)
                container.classList.remove('collapsed');
                toggleBtn.textContent = 'Overview';
                toggleBtn.classList.remove('overview');
                
                const displayWidth = getDisplayWidth();
                setTimelineBarAndMarkersWidth(displayWidth);
                segmentContainer.style.width = displayWidth + 'px';
                const deletedZonesContainer = document.getElementById('deletedZonesContainer');
                if (deletedZonesContainer) deletedZonesContainer.style.width = displayWidth + 'px';
                if (wrapper) wrapper.style.width = displayWidth + 'px';
                
                // Markers and segment positions are already correct after updateTimelineToCurrentDuration
                const markers = timeMarkers.querySelectorAll('.marker');
                markers.forEach(marker => {
                    const originalLeft = parseFloat(marker.dataset.originalLeft || marker.style.left);
                    marker.style.left = originalLeft + 'px';
                });
                repositionSegmentMarkersForDisplayWidth(displayWidth);
                
                const scrollEl = document.getElementById('timelineScrollable');
                setupMouseTracking(timelineBar, container, scrollEl, timelineData.totalSeconds, displayWidth);
                setupRangeSelection(timelineBar, timelineData.totalSeconds, displayWidth);
                setupAutoScroll(scrollEl);
                setTimeout(function() {
                    var bar = document.getElementById('timelineBar');
                    var markers = document.getElementById('timeMarkers');
                    console.log('[Full View] #timelineBar computed width: style.width=' + (bar ? bar.style.width : 'N/A') + ', offsetWidth=' + (bar ? bar.offsetWidth : 'N/A') + ', getBoundingClientRect().width=' + (bar ? bar.getBoundingClientRect().width : 'N/A'));
                    console.log('[Full View] #timeMarkers computed width: style.width=' + (markers ? markers.style.width : 'N/A') + ', offsetWidth=' + (markers ? markers.offsetWidth : 'N/A') + ', getBoundingClientRect().width=' + (markers ? markers.getBoundingClientRect().width : 'N/A'));
                }, 0);
            } else {
                // Collapsed view - fit entire timeline to container width
                container.classList.add('collapsed');
                toggleBtn.textContent = 'Full View';
                toggleBtn.classList.add('overview');
                
                const scrollElCollapsed = document.getElementById('timelineScrollable');
                if (scrollElCollapsed) scrollElCollapsed.scrollLeft = 0;
                
                // Force a reflow to get accurate container width
                container.style.display = 'block';
                
                // Get container width (accounting for padding: 20px on each side)
                const containerRect = container.getBoundingClientRect();
                const containerWidth = Math.max(100, containerRect.width - 40); // Subtract padding, min 100px
                const displayWidth = getDisplayWidth();
                
                // Scale from current display width (collapsed duration) to container width
                const scale = containerWidth / displayWidth;
                
                const scaledWidth = containerWidth;
                setTimelineBarAndMarkersWidth(scaledWidth);
                segmentContainer.style.width = scaledWidth + 'px';
                document.getElementById('deletedZonesContainer').style.width = scaledWidth + 'px';
                wrapper.style.width = scaledWidth + 'px';
                
                // Scale marker positions; keep first and last flush with bar edges
                const markers = timeMarkers.querySelectorAll('.marker');
                console.log('[Overview] scale=' + scale + ', scaledWidth=' + scaledWidth + ', marker count=' + markers.length);
                markers.forEach((marker, idx) => {
                    const originalLeft = parseFloat(marker.dataset.originalLeft || marker.style.left) || 0;
                    if (!marker.dataset.originalLeft) marker.dataset.originalLeft = String(originalLeft);
                    const isFirst = marker.classList.contains('marker-first');
                    const isLast = marker.classList.contains('marker-last');
                    const labelText = marker.querySelector('.marker-label') ? marker.querySelector('.marker-label').textContent : '?';
                    let finalLeft;
                    if (isFirst) { marker.style.left = '0px'; finalLeft = 0; }
                    else if (isLast) { marker.style.left = scaledWidth + 'px'; finalLeft = scaledWidth; }
                    else { finalLeft = originalLeft * scale; marker.style.left = finalLeft + 'px'; }
                    console.log('[Overview] marker ' + idx + ': ' + labelText + ', marker-first=' + isFirst + ', marker-last=' + isLast + ', originalLeft=' + originalLeft + ', final left=' + finalLeft + 'px');
                });
                
                // Scale segment marker positions (currently in 0..displayWidth from repositionSegmentMarkersForDisplayWidth)
                const segmentMarkers = segmentContainer.querySelectorAll('.segment-marker');
                segmentMarkers.forEach(marker => {
                    const currentLeft = parseFloat(marker.style.left) || 0;
                    marker.style.left = (currentLeft * scale) + 'px';
                });
                
                // Disable auto-scroll in collapsed view
                if (scrollElCollapsed && scrollElCollapsed._autoScrollMoveHandler) {
                    scrollElCollapsed.removeEventListener('mousemove', scrollElCollapsed._autoScrollMoveHandler);
                    scrollElCollapsed.removeEventListener('mouseleave', scrollElCollapsed._autoScrollLeaveHandler);
                }
                
                setupMouseTracking(timelineBar, container, scrollElCollapsed, timelineData.totalSeconds, scaledWidth);
                setTimeout(function() {
                    var bar = document.getElementById('timelineBar');
                    var markers = document.getElementById('timeMarkers');
                    console.log('[Overview] #timelineBar computed width: style.width=' + (bar ? bar.style.width : 'N/A') + ', offsetWidth=' + (bar ? bar.offsetWidth : 'N/A') + ', getBoundingClientRect().width=' + (bar ? bar.getBoundingClientRect().width : 'N/A'));
                    console.log('[Overview] #timeMarkers computed width: style.width=' + (markers ? markers.style.width : 'N/A') + ', offsetWidth=' + (markers ? markers.offsetWidth : 'N/A') + ', getBoundingClientRect().width=' + (markers ? markers.getBoundingClientRect().width : 'N/A'));
                }, 0);
            }
            
            if (timelineData.isExpanded) {
                const scrollElExp = document.getElementById('timelineScrollable');
                setupMouseTracking(timelineBar, container, scrollElExp, timelineData.totalSeconds, getDisplayWidth());
            }
            
            // Re-render deleted zones and chunks for current view
            renderDeletedZones();
            renderDeletedChunks();
        }

        function setupMouseTracking(timelineBar, container, scrollEl, totalSeconds, timelineWidth) {
            const cursorLine = document.getElementById('cursorLine');
            const cursorTimecode = document.getElementById('cursorTimecode');
            const overlayEl = document.getElementById('timelineCursorOverlay');
            let lastMouseX = null;
            let lastMouseY = null;
            let cursorUpdateAnimationId = null;

            // Remove existing listeners if they exist
            if (timelineBar._mouseMoveHandler) {
                timelineBar.removeEventListener('mousemove', timelineBar._mouseMoveHandler);
                timelineBar.removeEventListener('mouseleave', timelineBar._mouseLeaveHandler);
            }
            if (container._cursorMoveHandler) {
                container.removeEventListener('mousemove', container._cursorMoveHandler);
                container.removeEventListener('mouseleave', container._cursorLeaveHandler);
            }
            if (scrollEl._cursorScrollHandler) {
                scrollEl.removeEventListener('scroll', scrollEl._cursorScrollHandler);
            }

            // Function to update cursor position: viewport-relative position, then content (time) via scroll offset
            function updateCursorPosition() {
                if (isSelectingRange) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }
                if (lastMouseX === null || lastMouseY === null) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }

                const coords = getTimelineCoordsFromMouse(lastMouseX, lastMouseY);
                if (!coords) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }

                const viewportRect = scrollEl.getBoundingClientRect();
                const overlayRect = overlayEl.getBoundingClientRect();
                const barRect = timelineBar.getBoundingClientRect();
                const viewportXClamped = Math.max(0, Math.min(coords.viewportX, viewportRect.width));
                const contentXClamped = Math.max(0, Math.min(coords.contentX, coords.timelineWidth));
                const timeSeconds = compressedPixelToTime(contentXClamped, totalSeconds, coords.timelineWidth);
                const timecode = formatTime(Math.floor(timeSeconds));

                var lineTop = barRect.top - overlayRect.top;
                var lineHeight = barRect.height;
                cursorLine.style.top = lineTop + 'px';
                cursorLine.style.height = lineHeight + 'px';
                cursorLine.style.left = viewportXClamped + 'px';
                cursorLine.style.display = 'block';

                cursorTimecode.textContent = timecode;
                cursorTimecode.style.display = 'block';
                var labelWidth = cursorTimecode.offsetWidth;
                var labelHeight = cursorTimecode.offsetHeight;
                var halfLabel = labelWidth / 2;
                var labelCenter = Math.max(halfLabel, Math.min(viewportRect.width - halfLabel, viewportXClamped));
                var timecodeTop = Math.max(2, lineTop - labelHeight - 6);
                cursorTimecode.style.left = labelCenter + 'px';
                cursorTimecode.style.top = timecodeTop + 'px';
                cursorTimecode.style.transform = 'translateX(-50%)';
            }

            // Continuous update function for smooth tracking during scroll
            function continuousUpdate() {
                updateCursorPosition();
                cursorUpdateAnimationId = requestAnimationFrame(continuousUpdate);
            }

            // Track mouse on timeline bar
            timelineBar._mouseMoveHandler = function(e) {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateCursorPosition();
            };

            timelineBar._mouseLeaveHandler = function() {
                lastMouseX = null;
                lastMouseY = null;
                cursorLine.style.display = 'none';
                cursorTimecode.style.display = 'none';
                if (cursorUpdateAnimationId) {
                    cancelAnimationFrame(cursorUpdateAnimationId);
                    cursorUpdateAnimationId = null;
                }
            };

            // Track mouse on container so cursor updates at edges and during scroll
            container._cursorMoveHandler = function(e) {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateCursorPosition();
                if (getTimelineCoordsFromMouse(lastMouseX, lastMouseY) && !cursorUpdateAnimationId) {
                    continuousUpdate();
                }
            };

            container._cursorLeaveHandler = function() {
                lastMouseX = null;
                lastMouseY = null;
                cursorLine.style.display = 'none';
                cursorTimecode.style.display = 'none';
                if (cursorUpdateAnimationId) {
                    cancelAnimationFrame(cursorUpdateAnimationId);
                    cursorUpdateAnimationId = null;
                }
            };

            // Update cursor position during scroll (scrollEl scrolls, overlay stays fixed)
            scrollEl._cursorScrollHandler = function() {
                if (lastMouseX !== null && lastMouseY !== null) {
                    if (!cursorUpdateAnimationId) {
                        continuousUpdate();
                    }
                }
            };

            // Add listeners
            timelineBar.addEventListener('mousemove', timelineBar._mouseMoveHandler);
            timelineBar.addEventListener('mouseleave', timelineBar._mouseLeaveHandler);
            container.addEventListener('mousemove', container._cursorMoveHandler);
            container.addEventListener('mouseleave', container._cursorLeaveHandler);
            scrollEl.addEventListener('scroll', scrollEl._cursorScrollHandler);
        }

        function setupSegmentMarkers(timelineBar, totalSeconds, actualWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            segmentContainer.style.position = 'absolute';
            segmentContainer.style.top = '0';
            segmentContainer.style.left = '0';
            segmentContainer.style.width = actualWidth + 'px';
            segmentContainer.style.height = '60px';
            segmentContainer.style.pointerEvents = 'none';

            // Remove existing listeners if they exist
            if (timelineBar._rightClickHandler) {
                timelineBar.removeEventListener('contextmenu', timelineBar._rightClickHandler);
            }

            // Handle right-click to add segment
            timelineBar._rightClickHandler = function(e) {
                e.preventDefault();
                const rect = timelineBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const clampedX = Math.max(0, Math.min(x, actualWidth));
                
                // Calculate time at this position
                const timeSeconds = (clampedX / actualWidth) * totalSeconds;
                
                // Generate segment name
                const segmentName = `Seg ${String(segmentCounter).padStart(2, '0')}`;
                
                // Add segment
                addSegmentMarker(clampedX, segmentName, timeSeconds, totalSeconds, actualWidth);
                segmentCounter++;
            };

            timelineBar.addEventListener('contextmenu', timelineBar._rightClickHandler);
        }

        function addSegmentMarker(x, name, timeSeconds, totalSeconds, actualWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            
            // Create segment marker element
            const marker = document.createElement('div');
            marker.className = 'segment-marker';
            marker.style.left = x + 'px';
            marker.dataset.x = x;
            marker.dataset.name = name;
            marker.dataset.timeSeconds = timeSeconds;
            
            // Create label
            const label = document.createElement('div');
            label.className = 'segment-label';
            label.textContent = name;
            marker.appendChild(label);
            
            // Add click handler to delete
            marker.addEventListener('click', function(e) {
                e.stopPropagation();
                deleteSegmentMarker(marker);
            });
            
            // Make marker clickable
            marker.style.pointerEvents = 'auto';
            
            segmentContainer.appendChild(marker);
            
            // Store segment data
            segments.push({
                x: x,
                name: name,
                timeSeconds: timeSeconds,
                element: marker
            });
        }

        function deleteSegmentMarker(marker) {
            const name = marker.dataset.name;
            const index = segments.findIndex(seg => seg.element === marker);
            
            if (index !== -1) {
                segments.splice(index, 1);
                marker.remove();
            }
        }

        function setupAutoScroll(container) {
            const edgeZone = 60; // pixels from edge
            let scrollAnimationId = null;
            let isScrolling = false;

            // Remove existing listeners if they exist
            if (container._autoScrollMoveHandler) {
                container.removeEventListener('mousemove', container._autoScrollMoveHandler);
                container.removeEventListener('mouseleave', container._autoScrollLeaveHandler);
            }

            function calculateScrollSpeed(distanceFromEdge) {
                // Speed increases as distance decreases (closer to edge = faster)
                // Max speed when at edge (distance = 0), no speed at 60px
                const normalizedDistance = Math.max(0, Math.min(1, distanceFromEdge / edgeZone));
                const speed = (1 - normalizedDistance) * 15; // Max speed of 15 pixels per frame
                return speed;
            }

            function startScrolling(direction) {
                if (isScrolling) return;
                isScrolling = true;

                function scroll() {
                    if (!isScrolling) {
                        scrollAnimationId = null;
                        return;
                    }

                    const currentScroll = container.scrollLeft;
                    const maxScroll = container.scrollWidth - container.clientWidth;
                    
                    // Check if we can still scroll in this direction
                    if (direction === 'left' && currentScroll > 0) {
                        const rect = container.getBoundingClientRect();
                        const mouseX = container._lastMouseX - rect.left;
                        const distanceFromEdge = mouseX;
                        
                        if (distanceFromEdge < edgeZone) {
                            const speed = calculateScrollSpeed(distanceFromEdge);
                            container.scrollLeft = Math.max(0, currentScroll - speed);
                            scrollAnimationId = requestAnimationFrame(scroll);
                        } else {
                            isScrolling = false;
                            scrollAnimationId = null;
                        }
                    } else if (direction === 'right' && currentScroll < maxScroll) {
                        const rect = container.getBoundingClientRect();
                        const mouseX = container._lastMouseX - rect.left;
                        const distanceFromEdge = container.clientWidth - mouseX;
                        
                        if (distanceFromEdge < edgeZone) {
                            const speed = calculateScrollSpeed(distanceFromEdge);
                            container.scrollLeft = Math.min(maxScroll, currentScroll + speed);
                            scrollAnimationId = requestAnimationFrame(scroll);
                        } else {
                            isScrolling = false;
                            scrollAnimationId = null;
                        }
                    } else {
                        isScrolling = false;
                        scrollAnimationId = null;
                    }
                }

                scrollAnimationId = requestAnimationFrame(scroll);
            }

            function stopScrolling() {
                isScrolling = false;
                if (scrollAnimationId) {
                    cancelAnimationFrame(scrollAnimationId);
                    scrollAnimationId = null;
                }
            }

            container._autoScrollMoveHandler = function(e) {
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                container._lastMouseX = e.clientX;
                
                const distanceFromLeft = mouseX;
                const distanceFromRight = container.clientWidth - mouseX;
                
                // Check if mouse is in edge zones
                if (distanceFromLeft < edgeZone && distanceFromLeft >= 0) {
                    // Near left edge - scroll left
                    stopScrolling();
                    startScrolling('left');
                } else if (distanceFromRight < edgeZone && distanceFromRight >= 0) {
                    // Near right edge - scroll right
                    stopScrolling();
                    startScrolling('right');
                } else {
                    // Not in edge zone - stop scrolling
                    stopScrolling();
                }
            };

            container._autoScrollLeaveHandler = function() {
                stopScrolling();
            };

            container.addEventListener('mousemove', container._autoScrollMoveHandler);
            container.addEventListener('mouseleave', container._autoScrollLeaveHandler);
        }

        function setupRangeSelection(timelineBar, totalSeconds, actualWidth) {
            const rangeSelection = document.getElementById('rangeSelection');
            const rangeStartTimecode = document.getElementById('rangeStartTimecode');
            const rangeEndTimecode = document.getElementById('rangeEndTimecode');
            const scrollEl = document.getElementById('timelineScrollable');
            const overlayEl = document.getElementById('timelineCursorOverlay');
            const rangeOverlayIn = document.getElementById('rangeOverlayIn');
            const rangeOverlayOut = document.getElementById('rangeOverlayOut');

            function hideOverlayRangeLabels() {
                if (rangeOverlayIn) rangeOverlayIn.style.display = 'none';
                if (rangeOverlayOut) rangeOverlayOut.style.display = 'none';
            }

            // Remove existing listeners (may be on scrollEl / document)
            const oldDown = timelineBar._rangeMouseDown;
            const oldMove = timelineBar._rangeMouseMove;
            const oldUp = timelineBar._rangeMouseUp;
            if (oldDown) {
                timelineBar.removeEventListener('mousedown', oldDown);
                scrollEl.removeEventListener('mousedown', oldDown);
            }
            if (oldMove) {
                document.removeEventListener('mousemove', oldMove);
            }
            if (oldUp) {
                document.removeEventListener('mouseup', oldUp);
            }

            timelineBar._rangeMouseDown = function(e) {
                if (e.target.classList.contains('segment-marker') ||
                    e.target.closest('.deleted-zone') ||
                    e.target.closest('.deleted-chunk') ||
                    e.target.dataset.deletedRegion === 'true' ||
                    e.target.closest('[data-deleted-region="true"]')) {
                    return;
                }

                const coords = getTimelineCoordsFromMouse(e.clientX, e.clientY);
                if (!coords) return;

                e.preventDefault();
                e.stopPropagation();

                const contentXClamped = Math.max(0, Math.min(coords.contentX, coords.timelineWidth));
                rangeStartTime = compressedPixelToTime(contentXClamped, totalSeconds, coords.timelineWidth);

                if (isTimeInDeletedRegion(rangeStartTime)) return;

                rangeStartX = timeToCompressedPixel(rangeStartTime, totalSeconds, coords.timelineWidth);
                isSelectingRange = true;
                var barContainer = rangeSelection.closest('.timeline-bar-container');
                if (barContainer) barContainer.classList.add('range-dragging');
                if (scrollEl) scrollEl.classList.add('range-dragging');
                if (overlayEl) overlayEl.classList.add('range-dragging');

                rangeSelection.style.display = 'block';
                rangeSelection.style.left = rangeStartX + 'px';
                rangeSelection.style.width = '0px';
                rangeStartTimecode.style.display = 'none';
                rangeEndTimecode.style.display = 'none';
                currentRangeEndTime = rangeStartTime;

                var overlayRect = overlayEl.getBoundingClientRect();
                var startOverlayX = e.clientX - overlayRect.left;
                if (rangeOverlayIn) {
                    rangeOverlayIn.style.display = 'block';
                    rangeOverlayIn.style.left = startOverlayX + 'px';
                    rangeOverlayIn.textContent = formatTime(Math.floor(rangeStartTime));
                }
                if (rangeOverlayOut) {
                    rangeOverlayOut.style.display = 'block';
                    rangeOverlayOut.style.left = startOverlayX + 'px';
                    rangeOverlayOut.textContent = formatTime(Math.floor(rangeStartTime));
                }
                timelineBar._rangeStartOverlayX = startOverlayX;
            };

            timelineBar._rangeMouseMove = function(e) {
                if (!isSelectingRange) return;

                let coords = getTimelineCoordsFromMouse(e.clientX, e.clientY);
                if (!coords) coords = getTimelineContentXFromClient(e.clientX);
                if (!coords) return;

                const contentXClamped = Math.max(0, Math.min(coords.contentX, coords.timelineWidth));
                currentRangeEndTime = compressedPixelToTime(contentXClamped, totalSeconds, coords.timelineWidth);

                const compressedStartX = timeToCompressedPixel(rangeStartTime, totalSeconds, coords.timelineWidth);
                const compressedEndX = timeToCompressedPixel(currentRangeEndTime, totalSeconds, coords.timelineWidth);
                const startX = Math.min(compressedStartX, compressedEndX);
                const endX = Math.max(compressedStartX, compressedEndX);
                const width = endX - startX;

                rangeSelection.style.left = startX + 'px';
                rangeSelection.style.width = width + 'px';

                var overlayRect = overlayEl.getBoundingClientRect();
                var outOverlayX = e.clientX - overlayRect.left;
                if (rangeOverlayOut) {
                    rangeOverlayOut.style.left = outOverlayX + 'px';
                    rangeOverlayOut.textContent = formatTime(Math.floor(currentRangeEndTime));
                }
            };

            timelineBar._rangeMouseUp = function(e) {
                if (!isSelectingRange) return;
                hideOverlayRangeLabels();
                isSelectingRange = false;
                var barContainer = rangeSelection.closest('.timeline-bar-container');
                if (barContainer) barContainer.classList.remove('range-dragging');
                if (scrollEl) scrollEl.classList.remove('range-dragging');
                if (overlayEl) overlayEl.classList.remove('range-dragging');

                // Use the already calculated times (they're in actual time, not compressed)
                const inTime = Math.min(rangeStartTime, currentRangeEndTime);
                const outTime = Math.max(rangeStartTime, currentRangeEndTime);

                // Check if selection overlaps with deleted regions
                const overlapsDeleted = deleteAnnotations.some(annotation => 
                    (inTime >= annotation.inTime && inTime <= annotation.outTime) ||
                    (outTime >= annotation.inTime && outTime <= annotation.outTime) ||
                    (inTime <= annotation.inTime && outTime >= annotation.outTime)
                );

                if (overlapsDeleted) {
                    if (barContainer) barContainer.classList.remove('range-dragging');
                    if (scrollEl) scrollEl.classList.remove('range-dragging');
                    if (overlayEl) overlayEl.classList.remove('range-dragging');
                    rangeSelection.style.display = 'none';
                    rangeStartTimecode.style.display = 'none';
                    rangeEndTimecode.style.display = 'none';
                    return;
                }

                if (Math.abs(outTime - inTime) < 0.1) {
                    if (barContainer) barContainer.classList.remove('range-dragging');
                    if (scrollEl) scrollEl.classList.remove('range-dragging');
                    if (overlayEl) overlayEl.classList.remove('range-dragging');
                    rangeSelection.style.display = 'none';
                    rangeStartTimecode.style.display = 'none';
                    rangeEndTimecode.style.display = 'none';
                    return;
                }

                // Show delete popup
                showDeletePopup(inTime, outTime);
            };

            // Attach mousedown to scroll area so clicks work when scrolled (anywhere in timeline area)
            scrollEl.addEventListener('mousedown', timelineBar._rangeMouseDown);
            // Attach move/up to document so drag works even when cursor leaves the bar
            document.addEventListener('mousemove', timelineBar._rangeMouseMove);
            document.addEventListener('mouseup', timelineBar._rangeMouseUp);
        }

        function showDeletePopup(inTime, outTime) {
            const popup = document.getElementById('deletePopup');
            document.getElementById('popupInTimecode').textContent = formatTime(Math.floor(inTime));
            document.getElementById('popupOutTimecode').textContent = formatTime(Math.floor(outTime));
            document.getElementById('deleteComment').value = '';
            popup.style.display = 'block';
        }

        function closeDeletePopup() {
            document.getElementById('deletePopup').style.display = 'none';
            document.getElementById('rangeSelection').style.display = 'none';
            document.getElementById('rangeStartTimecode').style.display = 'none';
            document.getElementById('rangeEndTimecode').style.display = 'none';
        }

        function saveDeleteAnnotation() {
            const comment = document.getElementById('deleteComment').value.trim();
            const inTimecode = document.getElementById('popupInTimecode').textContent;
            const outTimecode = document.getElementById('popupOutTimecode').textContent;
            
            const inTime = parseTimecode(inTimecode);
            const outTime = parseTimecode(outTimecode);

            const annotation = {
                id: Date.now(),
                type: 'delete',
                inTime: inTime,
                outTime: outTime,
                inTimecode: inTimecode,
                outTimecode: outTimecode,
                comment: comment || '',
                completed: false,
                teamReply: '',
                segmentName: getSegmentNameForTime(inTime)
            };

            deleteAnnotations.push(annotation);
            deleteAnnotations.sort((a, b) => a.inTime - b.inTime);

            updateTimelineToCurrentDuration();
            updateDurationDisplay();
            renderSidebar();
            closeDeletePopup();
        }

        function parseTimecode(timecode) {
            const parts = timecode.split(':').map(Number);
            return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }

        function getSegmentNameForTime(timeSeconds) {
            const sorted = segments.slice().sort((a, b) => a.timeSeconds - b.timeSeconds);
            let name = 'Full timeline';
            for (const seg of sorted) {
                if (timeSeconds >= seg.timeSeconds) name = seg.name;
            }
            return name;
        }

        let annotationFilter = 'all';

        function renderSidebar() {

                if (!bySegment[seg]) bySegment[seg] = [];
                bySegment[seg].push(ann);

            const segmentOrder = [...new Set(filtered.map(a => a.segmentName || 'Full timeline'))];
            const sortedSegments = segmentOrder.sort((a, b) => {
                const firstA = bySegment[a][0];
                const firstB = bySegment[b][0];
                return (firstA?.inTime ?? 0) - (firstB?.inTime ?? 0);
            });

                const divider = document.createElement('div');

                    if (!ann.segmentName) ann.segmentName = getSegmentNameForTime(ann.inTime);
                    const row = document.createElement('div');
                    row.className = 'annotation-row' + (ann.completed ? ' completed' : '');
                    row.dataset.annotationId = ann.id;
                    const typeLabel = (ann.type || 'delete') === 'delete' ? 'Delete' : (ann.type || 'Delete').charAt(0).toUpperCase() + (ann.type || 'delete').slice(1);
                    row.innerHTML = `
                        <div class="annotation-colour-bar ${ann.type || 'delete'}"></div>
                        <div class="annotation-content">
                            <div class="annotation-top-line">
                                <span class="annotation-timecode">${ann.inTimecode} – ${ann.outTimecode}</span>
                                <span class="annotation-type">${typeLabel}</span>
                                <span class="annotation-segment">${ann.segmentName || '—'}</span>
                                ${ann.teamReply ? '<span class="reply-icon" title="Team reply">💬</span>' : ''}
                            </div>
                            <div class="annotation-comment">${escapeHtml(ann.comment || '')}</div>
                            <div class="annotation-reply-block" id="reply-${ann.id}">${escapeHtml(ann.teamReply || '')}</div>
                            <div class="annotation-controls">
                                <button class="edit-btn" type="button">Edit</button>
                                <button class="remove-btn" type="button">Remove</button>
                                <label><input type="checkbox" class="completed-cb" ${ann.completed ? 'checked' : ''}> Completed</label>
                                ${ann.completed ? '<span class="completed-check">✓</span>' : ''}
                            </div>
                        </div>
                    `;

                    const colourBar = row.querySelector('.annotation-colour-bar');
                    if (colourBar) colourBar.className = 'annotation-colour-bar ' + (ann.type || 'delete');

                    const replyIcon = row.querySelector('.reply-icon');
                    if (replyIcon) {
                        replyIcon.addEventListener('click', (e) => { e.stopPropagation(); row.querySelector('.annotation-reply-block').classList.toggle('visible'); });

                    row.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openDetailPanel(ann.id); });
                    row.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removeAnnotation(ann.id); });
                    row.querySelector('.completed-cb').addEventListener('change', (e) => { e.stopPropagation(); ann.completed = e.target.checked; renderSidebar(); });

                    row.addEventListener('click', (e) => {
                        if (e.target.closest('.annotation-controls') || e.target.closest('.reply-icon')) return;
                        highlightAnnotationOnTimeline(ann.id);
                        scrollTimelineToAnnotation(ann);
                        row.classList.add('highlighted');
                        row.classList.add('pulsing');
                        listEl.querySelectorAll('.annotation-row.highlighted').forEach(r => { if (r !== row) r.classList.remove('highlighted'); });
                        setTimeout(() => row.classList.remove('pulsing'), 600);
                        row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    });

                    listEl.appendChild(row);
                });
