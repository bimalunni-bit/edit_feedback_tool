        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function removeAnnotation(id) {
            const idx = deleteAnnotations.findIndex(a => a.id === id);
            if (idx === -1) return;
            deleteAnnotations.splice(idx, 1);
            updateTimelineToCurrentDuration();
            updateDurationDisplay();
            renderSidebar();
            clearTimelineHighlight();
        }

        function highlightAnnotationOnTimeline(annotationId) {
            clearTimelineHighlight();
            const zone = document.querySelector(`.deleted-zone[data-annotation-id="${annotationId}"]`);
            const overlay = document.querySelector(`[data-deleted-region="true"][data-annotation-id="${annotationId}"]`);
            if (zone) zone.classList.add('highlighted');
            if (overlay) overlay.classList.add('highlighted');
        }

        function clearTimelineHighlight() {
            document.querySelectorAll('.deleted-zone.highlighted, [data-deleted-region].highlighted').forEach(el => el.classList.remove('highlighted'));
        }

        function scrollTimelineToAnnotation(annotation) {
            const scrollEl = document.getElementById('timelineScrollable');
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar || !timelineData.totalSeconds) return;
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : (container.getBoundingClientRect().width - 40);
            const compressedX = timeToCompressedPixel(annotation.inTime, timelineData.totalSeconds, actualWidth);
            const scrollTarget = timelineData.isExpanded ? compressedX - scrollEl.clientWidth / 2 : 0;
            scrollEl.scrollLeft = Math.max(0, Math.min(scrollTarget, scrollEl.scrollWidth - scrollEl.clientWidth));
        }

        function highlightSidebarRow(annotationId) {
            document.querySelectorAll('.annotation-row.highlighted').forEach(r => r.classList.remove('highlighted'));
            const row = document.querySelector(`.annotation-row[data-annotation-id="${annotationId}"]`);
            if (row) {
                row.classList.add('highlighted');
                row.classList.add('pulsing');
                setTimeout(() => row.classList.remove('pulsing'), 600);
                row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        /**
         * Single source of truth for timeline mouse coordinates.
         * All timeline bar interactions must use this: position is relative to the VISIBLE viewport
         * on screen, then converted to content (time) by adding scroll offset.
         * @param {number} clientX - Mouse clientX
         * @param {number} clientY - Mouse clientY
         * @returns {{ viewportX: number, contentX: number, timelineWidth: number } | null} viewportX = px in visible strip, contentX = px in full content, or null if not over bar
         */
        function getTimelineCoordsFromMouse(clientX, clientY) {
            const scrollEl = document.getElementById('timelineScrollable');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar || !timelineData.totalSeconds) return null;

            const viewportRect = scrollEl.getBoundingClientRect();
            const barRect = timelineBar.getBoundingClientRect();

            if (clientY < barRect.top || clientY > barRect.bottom) return null;
            if (clientX < viewportRect.left || clientX > viewportRect.right) return null;

            const scrollLeft = timelineData.isExpanded ? scrollEl.scrollLeft : 0;
            const viewportX = clientX - viewportRect.left;
            const contentX = scrollLeft + viewportX;
            const timelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;

            return { viewportX, contentX, timelineWidth };
        }

        /** Content X (and timelineWidth) from clientX only; use for drag that may extend outside bar (e.g. range end). */
        function getTimelineContentXFromClient(clientX) {
            const scrollEl = document.getElementById('timelineScrollable');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar) return null;
            const viewportRect = scrollEl.getBoundingClientRect();
            const scrollLeft = timelineData.isExpanded ? scrollEl.scrollLeft : 0;
            const contentX = scrollLeft + (clientX - viewportRect.left);
            const timelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;
            return { contentX, timelineWidth };
        }

        // Helper function to calculate compressed pixel position from actual time
        function timeToCompressedPixel(time, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (time / totalSeconds) * timelineWidth;
            }

            let compressedTime = 0;
            let lastTime = 0;

            // Sort annotations by inTime
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            for (const annotation of sorted) {
                if (time <= annotation.inTime) {
                    // Time is before this deletion, add the gap and return
                    compressedTime += (time - lastTime);
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Add time up to deletion start
                compressedTime += (annotation.inTime - lastTime);
                
                if (time <= annotation.outTime) {
                    // Time is within this deletion - return position at deletion start (collapsed)
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Skip over deleted region, update lastTime
                lastTime = annotation.outTime;
            }

            // Time is after all deletions
            compressedTime += (time - lastTime);
            return (compressedTime / totalSeconds) * timelineWidth;
        }

        // Helper function to convert compressed pixel position back to actual time
        function compressedPixelToTime(pixelX, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (pixelX / timelineWidth) * totalSeconds;
            }

            const compressedTime = (pixelX / timelineWidth) * totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            let actualTime = 0;
            let compressedCounter = 0;
            let lastActualTime = 0;

            for (const annotation of sorted) {
                const segmentDuration = annotation.inTime - lastActualTime;
                
                if (compressedCounter + segmentDuration >= compressedTime) {
                    // Time is in this segment
                    actualTime = lastActualTime + (compressedTime - compressedCounter);
                    return actualTime;
                }
                
                compressedCounter += segmentDuration;
                lastActualTime = annotation.outTime;
            }

            // Time is after all deletions
            actualTime = lastActualTime + (compressedTime - compressedCounter);
            return actualTime;
        }

        // Check if a time is within a deleted region
        function isTimeInDeletedRegion(time) {
            return deleteAnnotations.some(annotation => 
                time >= annotation.inTime && time <= annotation.outTime
            );
        }

        function renderCompressedTimelineBackground() {
            const background = document.getElementById('compressedTimelineBackground');
            background.innerHTML = '';
            
            if (deleteAnnotations.length === 0) {
                background.style.display = 'none';
                return;
            }

            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            background.style.display = 'block';
            background.style.width = actualWidth + 'px';

            let lastTime = 0;
            let currentX = 0;

            sorted.forEach((annotation, index) => {
                // Render segment before deletion
                if (annotation.inTime > lastTime) {
                    const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                    const segmentEndX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                    const segmentWidth = segmentEndX - segmentStartX;

                    if (segmentWidth > 0) {
                        const segment = document.createElement('div');
                        segment.className = 'timeline-segment';
                        segment.style.left = segmentStartX + 'px';
                        segment.style.width = segmentWidth + 'px';
                        background.appendChild(segment);
                    }
                }

                // Render gap (collapsed deletion)
                const gapStartX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const gapEndX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const gapWidth = Math.max(2, gapEndX - gapStartX);

                const gap = document.createElement('div');
                gap.className = 'timeline-gap';
                gap.style.left = gapStartX + 'px';
                gap.style.width = gapWidth + 'px';
                background.appendChild(gap);

                lastTime = annotation.outTime;
            });

            // Render final segment after last deletion
            if (lastTime < totalSeconds) {
                const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                const segmentEndX = actualWidth;
                const segmentWidth = segmentEndX - segmentStartX;

                if (segmentWidth > 0) {
                    const segment = document.createElement('div');
                    segment.className = 'timeline-segment';
                    segment.style.left = segmentStartX + 'px';
                    segment.style.width = segmentWidth + 'px';
                    background.appendChild(segment);
                }
            }
        }

        function renderDeletedZones() {
            const container = document.getElementById('deletedZonesContainer');
            container.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;

            // Render compressed timeline background
            renderCompressedTimelineBackground();

            deleteAnnotations.forEach(annotation => {
                // Calculate compressed position for the in point
                const inX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);

                // Create non-selectable overlay zone covering the deleted region
                const compressedInX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const compressedOutX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const zoneWidth = Math.max(2, compressedOutX - compressedInX);

                // Thin red line at the in point (collapsed marker)
                const zone = document.createElement('div');
                zone.className = 'deleted-zone';
                zone.style.left = inX + 'px';
                zone.style.pointerEvents = 'auto';
                zone.dataset.annotationId = annotation.id;
                zone.dataset.inTime = annotation.inTime;
                zone.dataset.outTime = annotation.outTime;
                zone.onclick = () => { highlightSidebarRow(annotation.id); openDetailPanel(annotation.id); };
                container.appendChild(zone);

                // Create non-selectable overlay covering the entire deleted region
                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.left = compressedInX + 'px';
                overlay.style.width = zoneWidth + 'px';
                overlay.style.top = '0';
                overlay.style.height = '60px';
                overlay.style.pointerEvents = 'auto';
                overlay.style.cursor = 'not-allowed';
                overlay.style.backgroundColor = 'transparent';
                overlay.dataset.deletedRegion = 'true';
                overlay.dataset.annotationId = annotation.id;
                overlay.dataset.inTime = annotation.inTime;
                overlay.dataset.outTime = annotation.outTime;
                overlay.onclick = (e) => {
                    e.stopPropagation();
                    highlightSidebarRow(annotation.id);
                    openDetailPanel(annotation.id);
                };
                container.appendChild(overlay);
            });
        }

        function renderDeletedChunks() {
            const strip = document.getElementById('deletedChunksStrip');
            strip.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;

            deleteAnnotations.forEach(annotation => {
                const inX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const outX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const width = Math.max(50, outX - inX);

                const chunk = document.createElement('div');
                chunk.className = 'deleted-chunk';
                chunk.style.left = inX + 'px';
                chunk.style.width = width + 'px';
                chunk.dataset.annotationId = annotation.id;
                
                const label = document.createElement('span');
                label.className = 'deleted-chunk-label';
                label.textContent = `${annotation.inTimecode} - ${annotation.outTimecode}`;
                
                const comment = document.createElement('span');
                comment.textContent = annotation.comment ? `: ${annotation.comment}` : '';
                
                chunk.appendChild(label);
                chunk.appendChild(comment);
                chunk.onclick = () => { highlightSidebarRow(annotation.id); openDetailPanel(annotation.id); };
                strip.appendChild(chunk);
            });
        }

        function getCurrentDuration() {
            if (!timelineData.totalSeconds) return 0;
            let current = timelineData.totalSeconds;
            deleteAnnotations.forEach(annotation => {
                current -= (annotation.outTime - annotation.inTime);
            });
            return current;
        }

        function getDisplayWidth() {
            if (!timelineData.totalSeconds || !timelineData.actualWidth) return timelineData.actualWidth || 0;
            const currentDuration = getCurrentDuration();
            return timelineData.actualWidth * (currentDuration / timelineData.totalSeconds);
        }

        function rebuildTimeMarkersForCurrentDuration(displayWidth, currentDuration) {
            const timeMarkers = document.getElementById('timeMarkers');
            if (!timeMarkers || currentDuration <= 0) return;
            setTimelineBarAndMarkersWidth(displayWidth);
            timeMarkers.innerHTML = '';

            const markerInterval = calculateMarkerInterval(currentDuration);
            const totalSeconds = currentDuration;

            function appendMarker(time, leftPx, isFirst, isLast) {
                const marker = document.createElement('div');
                marker.className = 'marker' + (isFirst ? ' marker-first' : '') + (isLast ? ' marker-last' : '');
                marker.style.left = leftPx + 'px';
                marker.dataset.originalLeft = String(leftPx);
                const line = document.createElement('div');
                line.className = 'marker-line';
                const label = document.createElement('div');
                label.className = 'marker-label';
                label.textContent = formatTime(time);
                marker.appendChild(line);
                marker.appendChild(label);
                timeMarkers.appendChild(marker);
            }

            // 1) First marker: exactly 00:00:00 at left edge
            appendMarker(0, 0, true, false);

            // 2) Intermediate markers only (strictly between 0 and currentDuration)
            for (let i = 1; i * markerInterval < currentDuration; i++) {
                const time = i * markerInterval;
                const position = (time / totalSeconds) * displayWidth;
                appendMarker(time, position, false, false);
            }

            // 3) Last marker: exactly total duration at right edge
            appendMarker(currentDuration, displayWidth, false, true);
        }

        function repositionSegmentMarkersForDisplayWidth(displayWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const totalSeconds = timelineData.totalSeconds;
            if (!segmentContainer || !totalSeconds) return;
            const segmentMarkers = segmentContainer.querySelectorAll('.segment-marker');
            segmentMarkers.forEach(marker => {
                const originalX = parseFloat(marker.dataset.x);
                const timeSeconds = (originalX / timelineData.actualWidth) * totalSeconds;
                const newX = timeToCompressedPixel(timeSeconds, totalSeconds, displayWidth);
                marker.style.left = newX + 'px';
            });
        }

        function updateTimelineToCurrentDuration() {
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const deletedZonesContainer = document.getElementById('deletedZonesContainer');
            const wrapper = document.querySelector('.timeline-wrapper');

            if (!timelineData.totalSeconds || !timelineData.actualWidth) return;

            const currentDuration = getCurrentDuration();
            const displayWidth = getDisplayWidth();

            setTimelineBarAndMarkersWidth(displayWidth);
            segmentContainer.style.width = displayWidth + 'px';
            if (deletedZonesContainer) deletedZonesContainer.style.width = displayWidth + 'px';
            if (wrapper) wrapper.style.width = displayWidth + 'px';

            rebuildTimeMarkersForCurrentDuration(displayWidth, currentDuration);
            repositionSegmentMarkersForDisplayWidth(displayWidth);

            renderDeletedZones();
            renderDeletedChunks();

            const scrollEl = document.getElementById('timelineScrollable');
            setupMouseTracking(timelineBar, container, scrollEl, timelineData.totalSeconds, displayWidth);
            setupRangeSelection(timelineBar, timelineData.totalSeconds, displayWidth);
        }

        function updateDurationDisplay() {
            const originalDuration = timelineData.totalSeconds;
            const currentDuration = getCurrentDuration();

            const origEl = document.getElementById('sidebarOriginalDuration');
            const curEl = document.getElementById('sidebarCurrentDuration');
            if (origEl) origEl.textContent = formatTime(Math.floor(originalDuration));
            if (curEl) curEl.textContent = formatTime(Math.floor(currentDuration));
        }

        function openDetailPanel(annotationId) {
            const annotation = deleteAnnotations.find(a => a.id === annotationId);
            if (!annotation) return;

            document.getElementById('detailInTimecode').textContent = annotation.inTimecode;
            document.getElementById('detailOutTimecode').textContent = annotation.outTimecode;
            document.getElementById('detailComment').textContent = annotation.comment;
            document.getElementById('detailCompleted').checked = annotation.completed;
            document.getElementById('detailTeamReply').value = annotation.teamReply || '';

            // Store current annotation ID
            document.getElementById('detailPanel').dataset.annotationId = annotationId;

            document.getElementById('detailPanel').style.display = 'block';
        }

        function closeDetailPanel() {
            const panel = document.getElementById('detailPanel');
            const annotationId = parseInt(panel.dataset.annotationId);
            const annotation = deleteAnnotations.find(a => a.id === annotationId);

            if (annotation) {
                annotation.completed = document.getElementById('detailCompleted').checked;
                annotation.teamReply = document.getElementById('detailTeamReply').value;
            }

            panel.style.display = 'none';
            renderSidebar();
        }

        // Filter bar
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                annotationFilter = this.dataset.filter;
                renderSidebar();
            });
        });

        // Handle window resize for collapsed view
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (!timelineData.isExpanded && timelineData.totalSeconds) {
                    applyTimelineView();
                    renderDeletedZones();
                    renderDeletedChunks();
                }
            }, 100);
        });

        // Allow Enter key to trigger draw
        document.getElementById('duration').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                drawTimeline();
            }
        });
    </script>
</body>
</html>
