<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Timeline Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .left-column {
            width: 65%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .right-column {
            width: 35%;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-left: 1px solid #ccc;
            overflow: hidden;
        }

        .sidebar-header {
            flex-shrink: 0;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar-duration {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-duration .label { color: #666; }
        .sidebar-duration .value { color: #333; }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f8f8f8;
            cursor: pointer;
            color: #333;
        }

        .filter-btn:hover {
            background: #eee;
        }

        .filter-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .segment-divider {
            font-size: 11px;
            color: #888;
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            margin-top: 8px;
            background: #fafafa;
        }

        .segment-divider:first-child { margin-top: 0; }

        .annotation-row {
            display: flex;
            align-items: stretch;
            min-height: 72px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #fff;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .annotation-row:hover { background: #f8f9fa; }
        .annotation-row.highlighted { box-shadow: 0 0 0 2px #007bff; background: #e7f1ff; }
        .annotation-row.pulsing { animation: pulse 0.6s ease-out; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 4px rgba(0,123,255,0.6); }
            100% { box-shadow: none; }
        }

        .annotation-row.completed {
            background: #e8e8e8 !important;
            color: #666;
            opacity: 0.85;
        }

        .annotation-row.completed .annotation-timecode,
        .annotation-row.completed .annotation-type { color: #666; }

        .annotation-colour-bar {
            width: 4px;
            border-radius: 4px 0 0 4px;
            flex-shrink: 0;
        }

        .annotation-colour-bar.delete { background: #dc3545; }
        .annotation-colour-bar.content { background: #007bff; }
        .annotation-colour-bar.swap { background: #fd7e14; }
        .annotation-colour-bar.video { background: #6f42c1; }
        .annotation-colour-bar.audio { background: #20c997; }
        .annotation-colour-bar.text { background: #e83e8c; }
        

        .annotation-content {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .annotation-top-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .annotation-timecode { font-weight: bold; font-size: 13px; color: #333; }
        .annotation-type { font-size: 12px; color: #666; margin-left: 4px; }
        .annotation-segment { font-size: 11px; color: #888; margin-left: auto; }
        .annotation-comment { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .annotation-reply-block { font-size: 11px; color: #555; padding: 6px; background: #f0f0f0; border-radius: 4px; margin-top: 4px; display: none; }
        .annotation-reply-block.visible { display: block; }

        .annotation-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #eee;
        }

        .annotation-controls button {
            padding: 4px 10px;
            font-size: 11px;
            margin: 0;
        }

        .annotation-controls .edit-btn { background: #6c757d; }
        .annotation-controls .edit-btn:hover { background: #5a6268; }
        .annotation-controls .remove-btn { background: #dc3545; }
        .annotation-controls .remove-btn:hover { background: #c82333; }
        .annotation-controls input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .annotation-controls label { font-size: 11px; font-weight: normal; margin: 0; cursor: pointer; }
        .reply-icon { cursor: pointer; font-size: 14px; margin-left: auto; color: #007bff; }
        .completed-check { color: #28a745; font-size: 14px; margin-left: 4px; }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: fit-content;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #004085;
        }

        .timeline-view-controls {
            margin-top: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle-btn {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .view-toggle-btn:hover {
            background-color: #218838;
        }

        .view-toggle-btn.overview {
            background-color: #6c757d;
        }

        .view-toggle-btn.overview:hover {
            background-color: #5a6268;
        }

        .timeline-container {
            position: relative;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            overflow: hidden;
            padding: 20px;
        }

        /* Scrollable content only; overlay stays fixed so cursor is always visible */
        .timeline-scrollable {
            overflow-x: auto;
            overflow-y: visible;
            margin-top: 32px;
        }

        /* Viewport-fixed overlay: label zone above + bar zone; cursor line drawn only in bar zone */
        .timeline-cursor-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 92px;
            pointer-events: none;
            z-index: 25;
        }
        .timeline-cursor-overlay.range-dragging {
            z-index: 35;
        }

        .timeline-container.collapsed .timeline-scrollable {
            overflow-x: hidden;
        }
        .timeline-scrollable.range-dragging {
            z-index: 30;
            position: relative;
        }

        .timeline-wrapper {
            position: relative;
            min-width: 100%;
        }

        .timeline-bar-container {
            position: relative;
            margin-bottom: 30px;
        }
        .timeline-bar-container.range-dragging {
            z-index: 30;
        }

        .cursor-timecode {
            position: absolute;
            top: 4px;
            left: 0;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            pointer-events: none;
            transform: translateX(-50%);
            white-space: nowrap;
            display: none;
            z-index: 30;
        }

        .cursor-line {
            position: absolute;
            top: 32px;
            width: 2px;
            height: 60px;
            background-color: #007bff;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* Range drag labels in overlay: always on top, solid background, visible for entire drag */
        .range-overlay-timecode {
            position: absolute;
            top: 4px;
            left: 0;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            pointer-events: none;
            transform: translateX(-50%);
            white-space: nowrap;
            display: none;
            z-index: 35;
        }

        .timeline-bar {
            box-sizing: border-box;
            height: 60px;
            min-width: 0;
            max-width: none;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
            border: 1px solid #bbb;
            border-radius: 4px;
            position: relative;
            cursor: crosshair;
            z-index: 5;
            pointer-events: auto;
            /* width set by JS via setTimelineBarAndMarkersWidth() */
        }

        .compressed-timeline-background {
            position: absolute;
            top: 0;
            left: 0;
            height: 60px;
            pointer-events: none;
            z-index: 1;
        }

        .timeline-segment {
            position: absolute;
            top: 0;
            height: 60px;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
        }

        .timeline-gap {
            position: absolute;
            top: 0;
            height: 60px;
            background: repeating-linear-gradient(
                45deg,
                rgba(220, 53, 69, 0.1),
                rgba(220, 53, 69, 0.1) 5px,
                rgba(220, 53, 69, 0.05) 5px,
                rgba(220, 53, 69, 0.05) 10px
            );
            border-left: 1px solid rgba(220, 53, 69, 0.3);
            border-right: 1px solid rgba(220, 53, 69, 0.3);
        }

        .time-markers {
            position: relative;
            height: 30px;
            min-width: 0;
            max-width: none;
            border-top: 1px solid #ccc;
            overflow: hidden;
            /* width set by JS via setTimelineBarAndMarkersWidth() */
        }

        .marker {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            text-align: center;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
        }
        .marker.marker-first {
            left: 0;
            width: auto;
            transform: none;
            text-align: left;
            overflow: hidden;
        }
        .marker.marker-first .marker-label {
            text-align: left;
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }
        .marker.marker-last {
            transform: translateX(-100%);
            text-align: right;
            max-width: 100%;
            overflow: hidden;
        }
        .marker.marker-last .marker-label {
            text-align: right;
            max-width: 100%;
            overflow: hidden;
            text-overflow: clip;
        }

        .marker-line {
            width: 1px;
            height: 10px;
            background-color: #666;
            margin: 0 auto;
        }
        .marker.marker-first .marker-line {
            margin-left: 0;
            margin-right: auto;
        }
        .marker.marker-last .marker-line {
            margin-left: auto;
            margin-right: 0;
        }

        .marker-label {
            display: inline-block;
            font-size: 11px;
            color: #333;
            margin: 2px 0 0 0;
            padding: 0;
            white-space: nowrap;
            max-width: 100%;
            box-sizing: border-box;
        }

        .segment-marker {
            position: absolute;
            top: 0;
            width: 3px;
            height: 60px;
            background-color: #ff6b6b;
            cursor: pointer;
            z-index: 20;
            transform: translateX(-50%);
        }

        .segment-marker:hover {
            background-color: #ff5252;
            width: 4px;
        }

        .segment-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #ff6b6b;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #ff6b6b;
        }

        .duration-display {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .duration-item {
            display: flex;
            gap: 8px;
        }

        .duration-label {
            color: #666;
        }

        .duration-value {
            color: #333;
        }

        .range-selection {
            position: absolute;
            top: 0;
            height: 60px;
            background-color: rgba(0, 123, 255, 0.2);
            border-left: 2px solid #007bff;
            border-right: 2px solid #007bff;
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        .range-timecode {
            position: absolute;
            top: -28px;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            white-space: nowrap;
            pointer-events: none;
            transform: translateX(-50%);
            z-index: 30;
        }

        .delete-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 300px;
            display: none;
        }

        .delete-popup h3 {
            margin: 0 0 15px 0;
            color: #dc3545;
        }

        .delete-popup .timecode-display {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .delete-popup textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .delete-popup .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .delete-popup button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-popup .save-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-popup .save-btn:hover {
            background-color: #c82333;
        }

        .delete-popup .cancel-btn {
            background-color: #6c757d;
            color: white;
        }

        .delete-popup .cancel-btn:hover {
            background-color: #5a6268;
        }

        .deleted-zone {
            position: absolute;
            top: 0;
            width: 2px;
            height: 60px;
            background-color: #dc3545;
            cursor: pointer;
            z-index: 12;
            transform: translateX(-50%);
        }

        .swap-insert-block {
            position: absolute;
            top: 4px;
            height: 52px;
            background: rgba(144, 238, 144, 0.55);
            border: 1px solid #79c879;
            z-index: 6;
            pointer-events: none;
        }

        .export-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .viewer-mode-badge {
            font-size: 12px;
            color: #0c5460;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 4px;
            padding: 4px 6px;
            margin-bottom: 8px;
            display: none;
        }

        .deleted-zone:hover {
            width: 3px;
            background-color: #c82333;
        }

        .deleted-zone.highlighted,
        [data-deleted-region].highlighted {
            box-shadow: 0 0 0 2px #007bff;
            z-index: 14;
        }

        .deleted-chunks-strip {
            position: relative;
            height: 40px;
            margin-top: 10px;
            border-top: 1px solid #ccc;
            padding-top: 5px;
        }

        .deleted-chunk {
            position: absolute;
            height: 30px;
            background-color: #dc3545;
            border: 1px solid #c82333;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 10px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deleted-chunk:hover {
            background-color: #c82333;
        }

        .deleted-chunk-label {
            font-weight: bold;
            margin-right: 5px;
        }

        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            min-width: 400px;
            max-width: 600px;
            display: none;
        }

        .detail-panel h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .detail-panel .field {
            margin-bottom: 15px;
        }

        .detail-panel label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #666;
        }

        .detail-panel .timecode-field {
            font-family: monospace;
            font-size: 16px;
            color: #333;
        }

        .detail-panel .comment-field {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 60px;
            width: 100%;
            resize: vertical;
        }

        .detail-panel .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-panel .checkbox-field input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .detail-panel textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }

        .detail-panel .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .detail-panel button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .detail-panel .close-btn {
            background-color: #6c757d;
            color: white;
        }

        .detail-panel .close-btn:hover {
            background-color: #5a6268;
        }

        .duration-display { display: none; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="left-column">
            <div class="controls">
                <div class="control-group">
                    <label for="projectName">Project Name:</label>
                    <input type="text" id="projectName" placeholder="Enter project name">
                </div>
                <div class="control-group">
                    <label for="duration">Total Duration (hh:mm:ss):</label>
                    <input type="text" id="duration" placeholder="00:00:00" pattern="\d{2}:\d{2}:\d{2}">
                </div>
                <button onclick="drawTimeline()">Draw Timeline</button>
            </div>

            <div id="timelineViewControls" class="timeline-view-controls" style="display: none;">
                <button id="viewToggleBtn" class="view-toggle-btn" onclick="toggleTimelineView()">Overview</button>
            </div>

            <div id="timelineContainer" class="timeline-container" style="display: none;">
                <div id="timelineCursorOverlay" class="timeline-cursor-overlay">
                    <div id="cursorTimecode" class="cursor-timecode">00:00:00</div>
                    <div id="cursorLine" class="cursor-line"></div>
                    <div id="rangeOverlayIn" class="range-overlay-timecode">00:00:00</div>
                    <div id="rangeOverlayOut" class="range-overlay-timecode">00:00:00</div>
                </div>
                <div id="timelineScrollable" class="timeline-scrollable">
        <div class="timeline-wrapper">
            <div class="timeline-bar-container">
                <div id="rangeSelection" class="range-selection"></div>
                <div id="rangeStartTimecode" class="range-timecode"></div>
                <div id="rangeEndTimecode" class="range-timecode"></div>
                <div id="compressedTimelineBackground" class="compressed-timeline-background"></div>
                <div id="deletedZonesContainer"></div>
                <div id="segmentMarkersContainer"></div>
                <div id="timelineBar" class="timeline-bar"></div>
            </div>
            <div id="timeMarkers" class="time-markers"></div>
            <div id="deletedChunksStrip" class="deleted-chunks-strip"></div>
        </div>
                </div>
            </div>
        </div>

        <div id="sidebar" class="right-column" style="display: none; flex-direction: column;">
            <div class="sidebar-header">
                <div id="viewerModeBadge" class="viewer-mode-badge">Viewer Mode: you can only update Completed and Team Reply.</div>
                <div class="sidebar-duration">
                    <span class="label">Original:</span><span id="sidebarOriginalDuration" class="value">00:00:00</span>
                    <span class="label">Current:</span><span id="sidebarCurrentDuration" class="value">00:00:00</span>
                </div>
                <div class="export-bar">
                    <button onclick="exportViewerHtml()">Export HTML (Viewer)</button>
                    <button onclick="exportTextSummary()">Export Text (All)</button>
                    <button onclick="exportFilteredText()">Export Text (Current Filter)</button>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="delete">Delete</button>
                    <button class="filter-btn" data-filter="swap">Swap</button>
                    <button class="filter-btn" data-filter="video">Video</button>
                    <button class="filter-btn" data-filter="audio">Audio</button>
                    <button class="filter-btn" data-filter="text">Text & Graphics</button>
                    <button class="filter-btn" data-filter="content">Content</button>
                </div>
            </div>
            <div id="sidebarList" class="sidebar-list"></div>
        </div>
    </div>

    <!-- Range Annotation Popup -->
    <div id="deletePopup" class="delete-popup">
        <h3>Range Annotation</h3>
        <div class="timecode-display">
            <div>In: <span id="popupInTimecode"></span></div>
            <div>Out: <span id="popupOutTimecode"></span></div>
        </div>
        <select id="rangeMode">
            <option value="delete">Delete</option>
            <option value="swap">Swap</option>
        </select>

            <label>Out Timecode:</label>

    <script>
        let timelineData = {
            totalSeconds: 0,
            actualWidth: 0,
            isExpanded: true
        };

        let segments = [];
        let deleteAnnotations = [];
        let isSelectingRange = false;
        let rangeStartX = 0;
        let rangeStartTime = 0;
        let currentRangeEndX = 0;
        let currentRangeEndTime = 0;
        let state = { projectName: '', totalSeconds: 0, isExpanded: true, annotations: [] };
        let ownerMode = true;
        let autosaveIntervalId = null;
        let pendingRangeData = null;
        let pendingSwapData = null;
        let annotationFilter = 'all';

        function getDeleteAnnotations() { return state.annotations.filter(a => a.type === 'delete'); }
        function syncDeleteAnnotations() { deleteAnnotations = getDeleteAnnotations(); }
        function saveState() {
            if (!ownerMode) return;
            state.totalSeconds = timelineData.totalSeconds;
            state.isExpanded = timelineData.isExpanded;
            localStorage.setItem('timeline_owner_state_v4', JSON.stringify(state));
        }
        function scheduleAutoSave() { if (!autosaveIntervalId) autosaveIntervalId = setInterval(saveState, 60000); }
        function markStateMutation() { syncDeleteAnnotations(); saveState(); }
        function loadState() {
            const raw = localStorage.getItem('timeline_owner_state_v4');
            if (!raw) return;
            try { const loaded = JSON.parse(raw); state = Object.assign(state, loaded || {}); state.annotations = Array.isArray(state.annotations) ? state.annotations : []; syncDeleteAnnotations(); }
            catch (e) { console.warn('Failed to load state', e); }
        }
        function getFilteredAnnotations() {
            const sorted = [...state.annotations].sort((a, b) => ((a.inTime ?? a.atTime ?? 0) - (b.inTime ?? b.atTime ?? 0)));
            if (annotationFilter === 'all') return sorted;
            return sorted.filter(a => a.type === annotationFilter);
        }

        function formatAnnotationTime(ann) {
            if (ann.type === 'delete') return `${ann.inTimecode} – ${ann.outTimecode}`;
            if (ann.type === 'swap') return `${ann.inTimecode} – ${ann.outTimecode} -> @ ${ann.insertAtTimecode || ''}`;
            return `AT ${ann.atTimecode}`;
        }

        function renderSidebar() {
            const listEl = document.getElementById('sidebarList');
            listEl.innerHTML = '';
            getFilteredAnnotations().forEach(ann => {
                const typeLabelMap = { delete: 'Delete', swap: 'Swap', video: 'Video', audio: 'Audio', text: 'Text & Graphics', content: 'Content' };
                const row = document.createElement('div');
                row.className = 'annotation-row' + (ann.completed ? ' completed' : '');
                row.dataset.annotationId = ann.id;
                row.innerHTML = `
                    <div class="annotation-colour-bar ${ann.type}"></div>
                    <div class="annotation-content">
                        <div class="annotation-top-line">
                            <span class="annotation-timecode">${formatAnnotationTime(ann)}</span>
                            <span class="annotation-type">${typeLabelMap[ann.type] || ann.type}</span>
                        </div>
                        <div class="annotation-comment">${escapeHtml(ann.comment || '')}</div>
                        <div class="annotation-reply-block ${ann.teamReply ? 'visible' : ''}">${escapeHtml(ann.teamReply || '')}</div>
                        <div class="annotation-controls">
                            ${ownerMode ? '<button class="edit-btn">Edit</button><button class="remove-btn">Remove</button>' : ''}
                            <input type="checkbox" class="completed-cb" ${ann.completed ? 'checked' : ''}>
                            <label>Completed</label>
                            <input type="text" class="team-reply-input" placeholder="Team reply" value="${escapeHtml(ann.teamReply || '')}">
                        </div>
                    </div>`;
                if (ownerMode) {
                    row.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openDetailPanel(ann.id); });
                    row.querySelector('.remove-btn').addEventListener('click', (e) => { e.stopPropagation(); removeAnnotation(ann.id); });
                }
                row.querySelector('.completed-cb').addEventListener('change', (e) => { ann.completed = e.target.checked; markStateMutation(); renderSidebar(); });
                row.querySelector('.team-reply-input').addEventListener('input', (e) => { ann.teamReply = e.target.value; markStateMutation(); });
                listEl.appendChild(row);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function removeAnnotation(id) {
            const idx = state.annotations.findIndex(a => a.id === id);
            if (idx === -1) return;
            state.annotations.splice(idx, 1);
            syncDeleteAnnotations();
            updateTimelineToCurrentDuration();
            updateDurationDisplay();
            renderSidebar();
            clearTimelineHighlight();
            markStateMutation();
        }

        function highlightAnnotationOnTimeline(annotationId) {
            clearTimelineHighlight();
            const zone = document.querySelector(`.deleted-zone[data-annotation-id="${annotationId}"]`);
            const overlay = document.querySelector(`[data-deleted-region="true"][data-annotation-id="${annotationId}"]`);
            if (zone) zone.classList.add('highlighted');
            if (overlay) overlay.classList.add('highlighted');
        }

        function clearTimelineHighlight() {
            document.querySelectorAll('.deleted-zone.highlighted, [data-deleted-region].highlighted').forEach(el => el.classList.remove('highlighted'));
        }

        function scrollTimelineToAnnotation(annotation) {
            const scrollEl = document.getElementById('timelineScrollable');
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar || !timelineData.totalSeconds) return;
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : (container.getBoundingClientRect().width - 40);
            const anchorTime = annotation.inTime ?? annotation.atTime ?? 0;
            const compressedX = timeToCompressedPixel(anchorTime, timelineData.totalSeconds, actualWidth);
            const scrollTarget = timelineData.isExpanded ? compressedX - scrollEl.clientWidth / 2 : 0;
            scrollEl.scrollLeft = Math.max(0, Math.min(scrollTarget, scrollEl.scrollWidth - scrollEl.clientWidth));
        }

        function highlightSidebarRow(annotationId) {
            document.querySelectorAll('.annotation-row.highlighted').forEach(r => r.classList.remove('highlighted'));
            const row = document.querySelector(`.annotation-row[data-annotation-id="${annotationId}"]`);
            if (row) {
                row.classList.add('highlighted');
                row.classList.add('pulsing');
                setTimeout(() => row.classList.remove('pulsing'), 600);
                row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        /**
         * Single source of truth for timeline mouse coordinates.
         * All timeline bar interactions must use this: position is relative to the VISIBLE viewport
         * on screen, then converted to content (time) by adding scroll offset.
         * @param {number} clientX - Mouse clientX
         * @param {number} clientY - Mouse clientY
         * @returns {{ viewportX: number, contentX: number, timelineWidth: number } | null} viewportX = px in visible strip, contentX = px in full content, or null if not over bar
         */
        function getTimelineCoordsFromMouse(clientX, clientY) {
            const scrollEl = document.getElementById('timelineScrollable');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar || !timelineData.totalSeconds) return null;

            const viewportRect = scrollEl.getBoundingClientRect();
            const barRect = timelineBar.getBoundingClientRect();

            if (clientY < barRect.top || clientY > barRect.bottom) return null;
            const timelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;
            const scrollLeft = timelineData.isExpanded ? scrollEl.scrollLeft : 0;
            const relativeBarX = clientX - barRect.left;
            const clampedBarX = Math.max(0, Math.min(relativeBarX, timelineWidth));
            const contentX = timelineData.isExpanded ? (scrollLeft + clampedBarX) : clampedBarX;
            const viewportX = clientX - viewportRect.left;

            return { viewportX, contentX, timelineWidth };
        }

        /** Content X (and timelineWidth) from clientX only; use for drag that may extend outside bar (e.g. range end). */
        function getTimelineContentXFromClient(clientX) {
            const scrollEl = document.getElementById('timelineScrollable');
            const timelineBar = document.getElementById('timelineBar');
            if (!scrollEl || !timelineBar) return null;
            const barRect = timelineBar.getBoundingClientRect();
            const scrollLeft = timelineData.isExpanded ? scrollEl.scrollLeft : 0;
            const timelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;
            const relativeBarX = clientX - barRect.left;
            const clampedBarX = Math.max(0, Math.min(relativeBarX, timelineWidth));
            const contentX = timelineData.isExpanded ? (scrollLeft + clampedBarX) : clampedBarX;
            return { contentX, timelineWidth };
        }

        // Helper function to calculate compressed pixel position from actual time
        function timeToCompressedPixel(time, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (time / totalSeconds) * timelineWidth;
            }

            let compressedTime = 0;
            let lastTime = 0;

            // Sort annotations by inTime
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            for (const annotation of sorted) {
                if (time <= annotation.inTime) {
                    // Time is before this deletion, add the gap and return
                    compressedTime += (time - lastTime);
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Add time up to deletion start
                compressedTime += (annotation.inTime - lastTime);
                
                if (time <= annotation.outTime) {
                    // Time is within this deletion - return position at deletion start (collapsed)
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Skip over deleted region, update lastTime
                lastTime = annotation.outTime;
            }

            // Time is after all deletions
            compressedTime += (time - lastTime);
            return (compressedTime / totalSeconds) * timelineWidth;
        }

        // Helper function to convert compressed pixel position back to actual time
        function compressedPixelToTime(pixelX, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (pixelX / timelineWidth) * totalSeconds;
            }

            const compressedTime = (pixelX / timelineWidth) * totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            let actualTime = 0;
            let compressedCounter = 0;
            let lastActualTime = 0;

            for (const annotation of sorted) {
                const segmentDuration = annotation.inTime - lastActualTime;
                
                if (compressedCounter + segmentDuration >= compressedTime) {
                    // Time is in this segment
                    actualTime = lastActualTime + (compressedTime - compressedCounter);
                    return actualTime;
                }
                
                compressedCounter += segmentDuration;
                lastActualTime = annotation.outTime;
            }

            // Time is after all deletions
            actualTime = lastActualTime + (compressedTime - compressedCounter);
            return actualTime;
        }

        // Check if a time is within a deleted region
        function isTimeInDeletedRegion(time) {
            return deleteAnnotations.some(annotation => 
                time >= annotation.inTime && time <= annotation.outTime
            );
        }

        function renderCompressedTimelineBackground() {
            const background = document.getElementById('compressedTimelineBackground');
            background.innerHTML = '';
            
            if (deleteAnnotations.length === 0) {
                background.style.display = 'none';
                return;
            }

            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            background.style.display = 'block';
            background.style.width = actualWidth + 'px';

            let lastTime = 0;
            let currentX = 0;

            sorted.forEach((annotation, index) => {
                // Render segment before deletion
                if (annotation.inTime > lastTime) {
                    const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                    const segmentEndX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                    const segmentWidth = segmentEndX - segmentStartX;

                    if (segmentWidth > 0) {
                        const segment = document.createElement('div');
                        segment.className = 'timeline-segment';
                        segment.style.left = segmentStartX + 'px';
                        segment.style.width = segmentWidth + 'px';
                        background.appendChild(segment);
                    }
                }

                // Render gap (collapsed deletion)
                const gapStartX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const gapEndX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const gapWidth = Math.max(2, gapEndX - gapStartX);

                const gap = document.createElement('div');
                gap.className = 'timeline-gap';
                gap.style.left = gapStartX + 'px';
                gap.style.width = gapWidth + 'px';
                background.appendChild(gap);

                lastTime = annotation.outTime;
            });

            // Render final segment after last deletion
            if (lastTime < totalSeconds) {
                const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                const segmentEndX = actualWidth;
                const segmentWidth = segmentEndX - segmentStartX;

                if (segmentWidth > 0) {
                    const segment = document.createElement('div');
                    segment.className = 'timeline-segment';
                    segment.style.left = segmentStartX + 'px';
                    segment.style.width = segmentWidth + 'px';
                    background.appendChild(segment);
                }
            }
        }

        function renderDeletedZones() {
            const container = document.getElementById('deletedZonesContainer');
            container.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;

            // Render compressed timeline background
            renderCompressedTimelineBackground();

            deleteAnnotations.forEach(annotation => {
                // Collapsed redline at resume boundary (post-delete)
                const resumeTime = Math.min(timelineData.totalSeconds, annotation.outTime + 1);
                const inX = timeToCompressedPixel(resumeTime, totalSeconds, actualWidth);

                // Create non-selectable overlay zone covering the deleted region
                const compressedInX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const compressedOutX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const zoneWidth = Math.max(2, compressedOutX - compressedInX);

                // Thin red line at the in point (collapsed marker)
                const zone = document.createElement('div');
                zone.className = 'deleted-zone';
                zone.style.left = inX + 'px';
                zone.style.pointerEvents = 'auto';
                zone.dataset.annotationId = annotation.id;
                zone.dataset.inTime = annotation.inTime;
                zone.dataset.outTime = annotation.outTime;
                zone.onclick = () => { highlightSidebarRow(annotation.id); openDetailPanel(annotation.id); };
                container.appendChild(zone);

                // Create non-selectable overlay covering the entire deleted region
                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.left = compressedInX + 'px';
                overlay.style.width = zoneWidth + 'px';
                overlay.style.top = '0';
                overlay.style.height = '60px';
                overlay.style.pointerEvents = 'auto';
                overlay.style.cursor = 'not-allowed';
                overlay.style.backgroundColor = 'transparent';
                overlay.dataset.deletedRegion = 'true';
                overlay.dataset.annotationId = annotation.id;
                overlay.dataset.inTime = annotation.inTime;
                overlay.dataset.outTime = annotation.outTime;
                overlay.onclick = (e) => {
                    e.stopPropagation();
                    highlightSidebarRow(annotation.id);
                    openDetailPanel(annotation.id);
                };
                container.appendChild(overlay);
            });
        }


        function renderSwapBlocks() {
            document.querySelectorAll('.swap-insert-block.saved').forEach(el => el.remove());
            const timelineBar = document.getElementById('timelineBar');
            if (!timelineBar) return;
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            state.annotations.filter(a => a.type === 'swap').forEach(annotation => {
                const startX = timeToCompressedPixel(annotation.insertAtTime || 0, timelineData.totalSeconds, actualWidth);
                const width = Math.max(6, ((annotation.outTime - annotation.inTime) / timelineData.totalSeconds) * actualWidth);
                const block = document.createElement('div');
                block.className = 'swap-insert-block saved';
                block.style.left = Math.max(0, Math.min(startX, actualWidth - width)) + 'px';
                block.style.width = width + 'px';
                timelineBar.appendChild(block);
            });
        }

        function renderDeletedChunks() {
            const strip = document.getElementById('deletedChunksStrip');
            strip.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? getDisplayWidth() : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;

            deleteAnnotations.forEach(annotation => {
                const inX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const outX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const width = Math.max(50, outX - inX);

                const chunk = document.createElement('div');
                chunk.className = 'deleted-chunk';
                chunk.style.left = inX + 'px';
                chunk.style.width = width + 'px';
                chunk.dataset.annotationId = annotation.id;
                
                const label = document.createElement('span');
                label.className = 'deleted-chunk-label';
                label.textContent = `${annotation.inTimecode} - ${annotation.outTimecode}`;
                
                const comment = document.createElement('span');
                comment.textContent = annotation.comment ? `: ${annotation.comment}` : '';
                
                chunk.appendChild(label);
                chunk.appendChild(comment);
                chunk.onclick = () => { highlightSidebarRow(annotation.id); openDetailPanel(annotation.id); };
                strip.appendChild(chunk);
            });
        }

        function getCurrentDuration() {
            if (!timelineData.totalSeconds) return 0;
            let current = timelineData.totalSeconds;
            deleteAnnotations.forEach(annotation => {
                current -= (annotation.outTime - annotation.inTime);
            });
            return current;
        }

        function getDisplayWidth() {
            if (!timelineData.totalSeconds || !timelineData.actualWidth) return timelineData.actualWidth || 0;
            const currentDuration = getCurrentDuration();
            return timelineData.actualWidth * (currentDuration / timelineData.totalSeconds);
        }

        function rebuildTimeMarkersForCurrentDuration(displayWidth, currentDuration) {
            const timeMarkers = document.getElementById('timeMarkers');
            if (!timeMarkers || currentDuration <= 0) return;
            setTimelineBarAndMarkersWidth(displayWidth);
            timeMarkers.innerHTML = '';

            const markerInterval = calculateMarkerInterval(currentDuration);
            const totalSeconds = currentDuration;

            function appendMarker(time, leftPx, isFirst, isLast) {
                const marker = document.createElement('div');
                marker.className = 'marker' + (isFirst ? ' marker-first' : '') + (isLast ? ' marker-last' : '');
                marker.style.left = leftPx + 'px';
                marker.dataset.originalLeft = String(leftPx);
                const line = document.createElement('div');
                line.className = 'marker-line';
                const label = document.createElement('div');
                label.className = 'marker-label';
                label.textContent = formatTime(time);
                marker.appendChild(line);
                marker.appendChild(label);
                timeMarkers.appendChild(marker);
            }

            // 1) First marker: exactly 00:00:00 at left edge
            appendMarker(0, 0, true, false);

            // 2) Intermediate markers only (strictly between 0 and currentDuration)
            for (let i = 1; i * markerInterval < currentDuration; i++) {
                const time = i * markerInterval;
                const position = (time / totalSeconds) * displayWidth;
                appendMarker(time, position, false, false);
            }

            // 3) Last marker: exactly total duration at right edge
            appendMarker(currentDuration, displayWidth, false, true);
        }

        function repositionSegmentMarkersForDisplayWidth(displayWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const totalSeconds = timelineData.totalSeconds;
            if (!segmentContainer || !totalSeconds) return;
            const segmentMarkers = segmentContainer.querySelectorAll('.segment-marker');
            segmentMarkers.forEach(marker => {
                const originalX = parseFloat(marker.dataset.x);
                const timeSeconds = (originalX / timelineData.actualWidth) * totalSeconds;
                const newX = timeToCompressedPixel(timeSeconds, totalSeconds, displayWidth);
                marker.style.left = newX + 'px';
            });
        }

        function updateTimelineToCurrentDuration() {
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const deletedZonesContainer = document.getElementById('deletedZonesContainer');
            const wrapper = document.querySelector('.timeline-wrapper');

            if (!timelineData.totalSeconds || !timelineData.actualWidth) return;

            const currentDuration = getCurrentDuration();
            const displayWidth = getDisplayWidth();

            setTimelineBarAndMarkersWidth(displayWidth);
            segmentContainer.style.width = displayWidth + 'px';
            if (deletedZonesContainer) deletedZonesContainer.style.width = displayWidth + 'px';
            if (wrapper) wrapper.style.width = displayWidth + 'px';

            rebuildTimeMarkersForCurrentDuration(displayWidth, currentDuration);
            repositionSegmentMarkersForDisplayWidth(displayWidth);

            renderDeletedZones();
            renderDeletedChunks();
            renderSwapBlocks();

            const scrollEl = document.getElementById('timelineScrollable');
            setupMouseTracking(timelineBar, container, scrollEl, timelineData.totalSeconds, displayWidth);
            setupRangeSelection(timelineBar, timelineData.totalSeconds, displayWidth);
        }

        function updateDurationDisplay() {
            const originalDuration = timelineData.totalSeconds;
            const currentDuration = getCurrentDuration();

            const origEl = document.getElementById('sidebarOriginalDuration');
            const curEl = document.getElementById('sidebarCurrentDuration');
            if (origEl) origEl.textContent = formatTime(Math.floor(originalDuration));
            if (curEl) curEl.textContent = formatTime(Math.floor(currentDuration));
        }

        function openDetailPanel(annotationId) {
            const annotation = state.annotations.find(a => a.id === annotationId);
            if (!annotation) return;

            document.getElementById('detailInTimecode').textContent = annotation.inTimecode || annotation.atTimecode || '—';
            document.getElementById('detailOutTimecode').textContent = annotation.outTimecode || annotation.insertAtTimecode || '—';
            document.getElementById('detailComment').textContent = annotation.comment || '';
            document.getElementById('detailCompleted').checked = !!annotation.completed;
            document.getElementById('detailTeamReply').value = annotation.teamReply || '';
            document.getElementById('detailPanel').dataset.annotationId = annotationId;
            document.getElementById('detailPanel').style.display = 'block';
        }

        function closeDetailPanel() {
            const panel = document.getElementById('detailPanel');
            const annotationId = parseInt(panel.dataset.annotationId);
            const annotation = state.annotations.find(a => a.id === annotationId);

            if (annotation) {
                annotation.completed = document.getElementById('detailCompleted').checked;
                annotation.teamReply = document.getElementById('detailTeamReply').value;
                markStateMutation();
            }

            panel.style.display = 'none';
            renderSidebar();
        }


        function exportTextFromList(list) {
            return list.map(ann => {
                const header = ann.type === 'delete' ? `[DELETE] ${ann.inTimecode}–${ann.outTimecode}` :
                    ann.type === 'swap' ? `[SWAP] ${ann.inTimecode}–${ann.outTimecode} -> insert @ ${ann.insertAtTimecode}` :
                    `[${ann.type.toUpperCase()}] AT ${ann.atTimecode}`;
                const lines = [header + (ann.comment ? ` ${ann.comment}` : '')];
                if (ann.completed) lines.push('Completed: Yes');
                if (ann.teamReply) lines.push(`Team Reply: ${ann.teamReply}`);
                return lines.join('\n');
            }).join('\n\n');
        }

        function downloadTextFile(name, text) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function exportTextSummary() {
            const all = [...state.annotations].sort((a,b)=>(a.inTime??a.atTime??0)-(b.inTime??b.atTime??0));
            downloadTextFile('timeline_summary_all.txt', exportTextFromList(all));
        }

        function exportFilteredText() {
            downloadTextFile(`timeline_summary_${annotationFilter}.txt`, exportTextFromList(getFilteredAnnotations()));
        }

        function exportViewerHtml() {
            const clone = document.documentElement.outerHTML;
            const stateScript = `<script>window.__VIEWER_STATE__=${JSON.stringify(state)};<\/script>`;
            const viewerScript = `<script>window.__VIEWER_MODE__=true;<\/script>`;
            const html = '<!DOCTYPE html>' + clone.replace('<head>', `<head>${stateScript}${viewerScript}`);
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'timeline_viewer.html';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // Filter bar
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                annotationFilter = this.dataset.filter;
                renderSidebar();
            });
        });

        // Handle window resize for collapsed view
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (!timelineData.isExpanded && timelineData.totalSeconds) {
                    applyTimelineView();
                    renderDeletedZones();
                    renderDeletedChunks();
                }
            }, 100);
        });

        // Allow Enter key to trigger draw
        document.getElementById('duration').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                drawTimeline();
            }
        });
    

        document.getElementById('rangeMode').addEventListener('change', function() {
            const isSwap = this.value === 'swap';
            document.getElementById('rangePrimaryBtn').textContent = isSwap && (!pendingRangeData || pendingRangeData.insertAtTime === null) ? 'Next' : 'Save';
        });

        window.addEventListener('DOMContentLoaded', function() {
            ownerMode = !window.__VIEWER_MODE__;
            if (window.__VIEWER_STATE__) state = window.__VIEWER_STATE__;
            if (ownerMode) loadState();
            scheduleAutoSave();
            document.getElementById('viewerModeBadge').style.display = ownerMode ? 'none' : 'block';
            if (state.totalSeconds) {
                document.getElementById('duration').value = formatTime(state.totalSeconds);
                drawTimeline();
                timelineData.isExpanded = state.isExpanded !== false;
                syncDeleteAnnotations();
                applyTimelineView();
                updateTimelineToCurrentDuration();
                updateDurationDisplay();
                renderSidebar();
            }
        });

    </script>
</body>
</html>
