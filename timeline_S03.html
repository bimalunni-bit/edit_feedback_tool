<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Timeline Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: fit-content;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #004085;
        }

        .timeline-view-controls {
            margin-top: 30px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle-btn {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .view-toggle-btn:hover {
            background-color: #218838;
        }

        .view-toggle-btn.overview {
            background-color: #6c757d;
        }

        .view-toggle-btn.overview:hover {
            background-color: #5a6268;
        }

        .timeline-container {
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px;
        }

        .timeline-container.collapsed {
            overflow-x: hidden;
        }

        .timeline-wrapper {
            position: relative;
            min-width: 100%;
        }

        .timeline-bar-container {
            position: relative;
            margin-bottom: 30px;
        }

        .cursor-timecode {
            position: absolute;
            top: -25px;
            left: 0;
            font-size: 12px;
            font-weight: bold;
            color: #007bff;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            transform: translateX(-50%);
            white-space: nowrap;
            display: none;
        }

        .cursor-line {
            position: absolute;
            top: 0;
            width: 2px;
            height: 60px;
            background-color: #007bff;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .timeline-bar {
            height: 60px;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
            border: 2px solid #333;
            border-radius: 4px;
            position: relative;
            cursor: crosshair;
        }

        .compressed-timeline-background {
            position: absolute;
            top: 0;
            left: 0;
            height: 60px;
            pointer-events: none;
            z-index: 1;
        }

        .timeline-segment {
            position: absolute;
            top: 0;
            height: 60px;
            background: linear-gradient(to right, #e0e0e0, #f0f0f0);
        }

        .timeline-gap {
            position: absolute;
            top: 0;
            height: 60px;
            background: repeating-linear-gradient(
                45deg,
                rgba(220, 53, 69, 0.1),
                rgba(220, 53, 69, 0.1) 5px,
                rgba(220, 53, 69, 0.05) 5px,
                rgba(220, 53, 69, 0.05) 10px
            );
            border-left: 1px solid rgba(220, 53, 69, 0.3);
            border-right: 1px solid rgba(220, 53, 69, 0.3);
        }

        .time-markers {
            position: relative;
            height: 30px;
            border-top: 1px solid #ccc;
        }

        .marker {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            text-align: center;
        }

        .marker-line {
            width: 1px;
            height: 10px;
            background-color: #666;
            margin: 0 auto;
        }

        .marker-label {
            font-size: 11px;
            color: #333;
            margin-top: 2px;
            white-space: nowrap;
        }

        .segment-marker {
            position: absolute;
            top: 0;
            width: 3px;
            height: 60px;
            background-color: #ff6b6b;
            cursor: pointer;
            z-index: 20;
            transform: translateX(-50%);
        }

        .segment-marker:hover {
            background-color: #ff5252;
            width: 4px;
        }

        .segment-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #ff6b6b;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #ff6b6b;
        }

        .duration-display {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .duration-item {
            display: flex;
            gap: 8px;
        }

        .duration-label {
            color: #666;
        }

        .duration-value {
            color: #333;
        }

        .range-selection {
            position: absolute;
            top: 0;
            height: 60px;
            background-color: rgba(0, 123, 255, 0.2);
            border-left: 2px solid #007bff;
            border-right: 2px solid #007bff;
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        .range-timecode {
            position: absolute;
            top: -25px;
            font-size: 12px;
            font-weight: bold;
            color: #007bff;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            transform: translateX(-50%);
            z-index: 16;
        }

        .delete-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            min-width: 300px;
            display: none;
        }

        .delete-popup h3 {
            margin: 0 0 15px 0;
            color: #dc3545;
        }

        .delete-popup .timecode-display {
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .delete-popup textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .delete-popup .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .delete-popup button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-popup .save-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-popup .save-btn:hover {
            background-color: #c82333;
        }

        .delete-popup .cancel-btn {
            background-color: #6c757d;
            color: white;
        }

        .delete-popup .cancel-btn:hover {
            background-color: #5a6268;
        }

        .deleted-zone {
            position: absolute;
            top: 0;
            width: 2px;
            height: 60px;
            background-color: #dc3545;
            cursor: pointer;
            z-index: 12;
            transform: translateX(-50%);
        }

        .deleted-zone:hover {
            width: 3px;
            background-color: #c82333;
        }

        .deleted-chunks-strip {
            position: relative;
            height: 40px;
            margin-top: 10px;
            border-top: 1px solid #ccc;
            padding-top: 5px;
        }

        .deleted-chunk {
            position: absolute;
            height: 30px;
            background-color: #dc3545;
            border: 1px solid #c82333;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-size: 10px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deleted-chunk:hover {
            background-color: #c82333;
        }

        .deleted-chunk-label {
            font-weight: bold;
            margin-right: 5px;
        }

        .detail-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            min-width: 400px;
            max-width: 600px;
            display: none;
        }

        .detail-panel h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .detail-panel .field {
            margin-bottom: 15px;
        }

        .detail-panel label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #666;
        }

        .detail-panel .timecode-field {
            font-family: monospace;
            font-size: 16px;
            color: #333;
        }

        .detail-panel .comment-field {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 60px;
            width: 100%;
            resize: vertical;
        }

        .detail-panel .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-panel .checkbox-field input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .detail-panel textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }

        .detail-panel .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .detail-panel button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .detail-panel .close-btn {
            background-color: #6c757d;
            color: white;
        }

        .detail-panel .close-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <label for="projectName">Project Name:</label>
            <input type="text" id="projectName" placeholder="Enter project name">
        </div>
        <div class="control-group">
            <label for="duration">Total Duration (hh:mm:ss):</label>
            <input type="text" id="duration" placeholder="00:00:00" pattern="\d{2}:\d{2}:\d{2}">
        </div>
        <button onclick="drawTimeline()">Draw Timeline</button>
    </div>

    <div id="timelineViewControls" class="timeline-view-controls" style="display: none;">
        <button id="viewToggleBtn" class="view-toggle-btn" onclick="toggleTimelineView()">Overview</button>
        <div id="durationDisplay" class="duration-display" style="display: none;">
            <div class="duration-item">
                <span class="duration-label">Original Duration:</span>
                <span id="originalDuration" class="duration-value">00:00:00</span>
            </div>
            <div class="duration-item">
                <span class="duration-label">Current Duration:</span>
                <span id="currentDuration" class="duration-value">00:00:00</span>
            </div>
        </div>
    </div>

    <div id="timelineContainer" class="timeline-container" style="display: none;">
        <div class="timeline-wrapper">
            <div class="timeline-bar-container">
                <div id="cursorTimecode" class="cursor-timecode">00:00:00</div>
                <div id="cursorLine" class="cursor-line"></div>
                <div id="rangeSelection" class="range-selection"></div>
                <div id="rangeStartTimecode" class="range-timecode"></div>
                <div id="rangeEndTimecode" class="range-timecode"></div>
                <div id="compressedTimelineBackground" class="compressed-timeline-background"></div>
                <div id="deletedZonesContainer"></div>
                <div id="segmentMarkersContainer"></div>
                <div id="timelineBar" class="timeline-bar"></div>
            </div>
            <div id="timeMarkers" class="time-markers"></div>
            <div id="deletedChunksStrip" class="deleted-chunks-strip"></div>
        </div>
    </div>

    <!-- Delete Annotation Popup -->
    <div id="deletePopup" class="delete-popup">
        <h3>Delete Annotation</h3>
        <div class="timecode-display">
            <div>In: <span id="popupInTimecode"></span></div>
            <div>Out: <span id="popupOutTimecode"></span></div>
        </div>
        <textarea id="deleteComment" placeholder="Enter comment..."></textarea>
        <div class="button-group">
            <button class="cancel-btn" onclick="closeDeletePopup()">Cancel</button>
            <button class="save-btn" onclick="saveDeleteAnnotation()">Save</button>
        </div>
    </div>

    <!-- Detail Panel -->
    <div id="detailPanel" class="detail-panel">
        <h3>Delete Annotation Details</h3>
        <div class="field">
            <label>In Timecode:</label>
            <div id="detailInTimecode" class="timecode-field"></div>
        </div>
        <div class="field">
            <label>Out Timecode:</label>
            <div id="detailOutTimecode" class="timecode-field"></div>
        </div>
        <div class="field">
            <label>Comment:</label>
            <div id="detailComment" class="comment-field"></div>
        </div>
        <div class="field checkbox-field">
            <input type="checkbox" id="detailCompleted">
            <label for="detailCompleted">Completed</label>
        </div>
        <div class="field">
            <label>Team Reply:</label>
            <textarea id="detailTeamReply" placeholder="Enter team reply..."></textarea>
        </div>
        <div class="button-group">
            <button class="close-btn" onclick="closeDetailPanel()">Close</button>
        </div>
    </div>

    <script>
        let timelineData = {
            totalSeconds: 0,
            actualWidth: 0,
            isExpanded: true
        };

        let segments = [];
        let segmentCounter = 1;
        let deleteAnnotations = [];
        let isSelectingRange = false;
        let rangeStartX = 0;
        let rangeStartTime = 0;
        let currentRangeEndX = 0;
        let currentRangeEndTime = 0;

        function parseDuration(durationStr) {
            const parts = durationStr.split(':').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) {
                throw new Error('Invalid duration format. Use hh:mm:ss');
            }
            return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function calculateMarkerInterval(totalSeconds) {
            // Calculate appropriate interval based on total duration
            // Aim for roughly 10-20 markers visible at a time
            const pixelsPerSecond = 10; // Base scale: 10 pixels per second
            const targetMarkers = 15;
            const baseInterval = totalSeconds / targetMarkers;
            
            // Round to nice intervals: 1s, 5s, 10s, 30s, 1m, 5m, 10m, 30m, 1h
            const intervals = [1, 5, 10, 30, 60, 300, 600, 1800, 3600];
            for (let interval of intervals) {
                if (interval >= baseInterval) {
                    return interval;
                }
            }
            return intervals[intervals.length - 1];
        }

        function drawTimeline() {
            const durationInput = document.getElementById('duration').value.trim();
            const container = document.getElementById('timelineContainer');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');

            if (!durationInput) {
                alert('Please enter a duration');
                return;
            }

            try {
                const totalSeconds = parseDuration(durationInput);
                if (totalSeconds <= 0) {
                    alert('Duration must be greater than 0');
                    return;
                }

                // Calculate scale: 10 pixels per second
                const pixelsPerSecond = 10;
                const totalWidth = totalSeconds * pixelsPerSecond;
                const minWidth = 800; // Minimum width for short durations
                const actualWidth = Math.max(totalWidth, minWidth);

                // Set timeline bar width
                timelineBar.style.width = actualWidth + 'px';

                // Store timeline data for mouse tracking
                timelineData.totalSeconds = totalSeconds;
                timelineData.actualWidth = actualWidth;

                // Setup mouse tracking (will be updated when view changes)
                setupMouseTracking(timelineBar, container, totalSeconds, actualWidth);

                // Setup segment markers
                setupSegmentMarkers(timelineBar, totalSeconds, actualWidth);

                // Setup auto-scrolling
                setupAutoScroll(container);

                // Reset segments when redrawing timeline
                segments = [];
                segmentCounter = 1;
                document.getElementById('segmentMarkersContainer').innerHTML = '';

                // Calculate marker interval
                const markerInterval = calculateMarkerInterval(totalSeconds);
                const numMarkers = Math.floor(totalSeconds / markerInterval) + 1;

                // Clear existing markers
                timeMarkers.innerHTML = '';
                timeMarkers.style.width = actualWidth + 'px';

                // Create markers
                for (let i = 0; i <= numMarkers; i++) {
                    const time = i * markerInterval;
                    if (time > totalSeconds) break;

                    const marker = document.createElement('div');
                    marker.className = 'marker';
                    const position = (time / totalSeconds) * actualWidth;
                    marker.style.left = position + 'px';
                    marker.dataset.originalLeft = position; // Store original position

                    const line = document.createElement('div');
                    line.className = 'marker-line';

                    const label = document.createElement('div');
                    label.className = 'marker-label';
                    label.textContent = formatTime(time);

                    marker.appendChild(line);
                    marker.appendChild(label);
                    timeMarkers.appendChild(marker);
                }

                // Always add a marker at the exact end time if it's not already included
                const lastMarkerTime = Math.floor(totalSeconds / markerInterval) * markerInterval;
                if (lastMarkerTime < totalSeconds) {
                    const marker = document.createElement('div');
                    marker.className = 'marker';
                    marker.style.left = actualWidth + 'px'; // Position at the very end
                    marker.dataset.originalLeft = actualWidth; // Store original position

                    const line = document.createElement('div');
                    line.className = 'marker-line';

                    const label = document.createElement('div');
                    label.className = 'marker-label';
                    label.textContent = formatTime(totalSeconds);

                    marker.appendChild(line);
                    marker.appendChild(label);
                    timeMarkers.appendChild(marker);
                }

                // Reset delete annotations when redrawing
                deleteAnnotations = [];
                const deletedZonesContainer = document.getElementById('deletedZonesContainer');
                deletedZonesContainer.innerHTML = '';
                deletedZonesContainer.style.position = 'absolute';
                deletedZonesContainer.style.top = '0';
                deletedZonesContainer.style.left = '0';
                deletedZonesContainer.style.width = actualWidth + 'px';
                deletedZonesContainer.style.height = '60px';
                deletedZonesContainer.style.pointerEvents = 'none';
                document.getElementById('deletedChunksStrip').innerHTML = '';
                
                // Show container and controls
                container.style.display = 'block';
                document.getElementById('timelineViewControls').style.display = 'flex';
                document.getElementById('durationDisplay').style.display = 'flex';
                
                // Initialize duration display
                updateDurationDisplay(totalSeconds);
                
                // Setup range selection
                setupRangeSelection(timelineBar, totalSeconds, actualWidth);
                
                // Apply current view mode
                applyTimelineView();
            } catch (error) {
                alert(error.message);
            }
        }

        function toggleTimelineView() {
            timelineData.isExpanded = !timelineData.isExpanded;
            applyTimelineView();
        }

        function applyTimelineView() {
            const container = document.getElementById('timelineContainer');
            const toggleBtn = document.getElementById('viewToggleBtn');
            const timelineBar = document.getElementById('timelineBar');
            const timeMarkers = document.getElementById('timeMarkers');
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            const wrapper = document.querySelector('.timeline-wrapper');
            
            if (!timelineData.totalSeconds || !timelineData.actualWidth) {
                return; // Timeline not drawn yet
            }

            if (timelineData.isExpanded) {
                // Expanded view - original scrollable timeline
                container.classList.remove('collapsed');
                toggleBtn.textContent = 'Overview';
                toggleBtn.classList.remove('overview');
                
                // Reset to original width
                timelineBar.style.width = timelineData.actualWidth + 'px';
                timeMarkers.style.width = timelineData.actualWidth + 'px';
                segmentContainer.style.width = timelineData.actualWidth + 'px';
                document.getElementById('deletedZonesContainer').style.width = timelineData.actualWidth + 'px';
                wrapper.style.width = 'auto';
                
                // Reset marker positions
                const markers = timeMarkers.querySelectorAll('.marker');
                markers.forEach(marker => {
                    const originalLeft = parseFloat(marker.dataset.originalLeft || marker.style.left);
                    marker.style.left = originalLeft + 'px';
                });
                
                // Reset segment marker positions
                const segmentMarkers = segmentContainer.querySelectorAll('.segment-marker');
                segmentMarkers.forEach(marker => {
                    const originalX = parseFloat(marker.dataset.x);
                    marker.style.left = originalX + 'px';
                });
                
                // Re-enable auto-scroll
                setupAutoScroll(container);
            } else {
                // Collapsed view - fit entire timeline to container width
                container.classList.add('collapsed');
                toggleBtn.textContent = 'Full View';
                toggleBtn.classList.add('overview');
                
                // Force a reflow to get accurate container width
                container.style.display = 'block';
                
                // Get container width (accounting for padding: 20px on each side)
                const containerRect = container.getBoundingClientRect();
                const containerWidth = Math.max(100, containerRect.width - 40); // Subtract padding, min 100px
                
                // Calculate scale factor
                const scale = containerWidth / timelineData.actualWidth;
                
                // Set scaled width
                const scaledWidth = containerWidth;
                timelineBar.style.width = scaledWidth + 'px';
                timeMarkers.style.width = scaledWidth + 'px';
                segmentContainer.style.width = scaledWidth + 'px';
                document.getElementById('deletedZonesContainer').style.width = scaledWidth + 'px';
                wrapper.style.width = scaledWidth + 'px';
                
                // Scale marker positions
                const markers = timeMarkers.querySelectorAll('.marker');
                markers.forEach(marker => {
                    const originalLeft = parseFloat(marker.dataset.originalLeft || marker.style.left);
                    if (!marker.dataset.originalLeft) {
                        marker.dataset.originalLeft = originalLeft;
                    }
                    marker.style.left = (originalLeft * scale) + 'px';
                });
                
                // Scale segment marker positions
                const segmentMarkers = segmentContainer.querySelectorAll('.segment-marker');
                segmentMarkers.forEach(marker => {
                    const originalX = parseFloat(marker.dataset.x);
                    marker.style.left = (originalX * scale) + 'px';
                });
                
                // Disable auto-scroll in collapsed view
                if (container._autoScrollMoveHandler) {
                    container.removeEventListener('mousemove', container._autoScrollMoveHandler);
                    container.removeEventListener('mouseleave', container._autoScrollLeaveHandler);
                }
                
                // Update mouse tracking with collapsed width
                setupMouseTracking(timelineBar, container, timelineData.totalSeconds, scaledWidth);
            }
            
            // Update mouse tracking with current view state (for expanded view)
            if (timelineData.isExpanded) {
                setupMouseTracking(timelineBar, container, timelineData.totalSeconds, timelineData.actualWidth);
            }
            
            // Re-render deleted zones and chunks for current view
            renderDeletedZones();
            renderDeletedChunks();
        }

        function setupMouseTracking(timelineBar, container, totalSeconds, timelineWidth) {
            const cursorLine = document.getElementById('cursorLine');
            const cursorTimecode = document.getElementById('cursorTimecode');
            let lastMouseX = null;
            let lastMouseY = null;
            let cursorUpdateAnimationId = null;

            // Remove existing listeners if they exist
            if (timelineBar._mouseMoveHandler) {
                timelineBar.removeEventListener('mousemove', timelineBar._mouseMoveHandler);
                timelineBar.removeEventListener('mouseleave', timelineBar._mouseLeaveHandler);
            }
            if (container._cursorMoveHandler) {
                container.removeEventListener('mousemove', container._cursorMoveHandler);
                container.removeEventListener('mouseleave', container._cursorLeaveHandler);
            }
            if (container._cursorScrollHandler) {
                container.removeEventListener('scroll', container._cursorScrollHandler);
            }

            // Function to update cursor position based on stored mouse coordinates
            function updateCursorPosition() {
                // Hide cursor during range selection
                if (isSelectingRange) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }

                if (lastMouseX === null || lastMouseY === null) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }

                const containerRect = container.getBoundingClientRect();
                const timelineRect = timelineBar.getBoundingClientRect();
                
                // Check if mouse is still over the timeline area
                if (lastMouseY < timelineRect.top || lastMouseY > timelineRect.bottom ||
                    lastMouseX < containerRect.left || lastMouseX > containerRect.right) {
                    cursorLine.style.display = 'none';
                    cursorTimecode.style.display = 'none';
                    return;
                }
                
                // Calculate mouse position relative to the container's visible area
                const mouseXInContainer = lastMouseX - containerRect.left;
                
                // Calculate the actual position on the timeline bar accounting for scroll
                const scrollLeft = timelineData.isExpanded ? container.scrollLeft : 0;
                const timelineX = scrollLeft + mouseXInContainer;
                
                // Clamp to timeline bounds
                const clampedX = Math.max(0, Math.min(timelineX, timelineWidth));
                
                // Convert compressed pixel position to actual time
                const timeSeconds = compressedPixelToTime(clampedX, totalSeconds, timelineWidth);
                const timecode = formatTime(Math.floor(timeSeconds));
                
                // Position cursor line at compressed position (visual follows compressed timeline)
                const compressedX = timeToCompressedPixel(timeSeconds, totalSeconds, timelineWidth);
                cursorLine.style.left = compressedX + 'px';
                cursorLine.style.display = 'block';
                
                cursorTimecode.textContent = timecode;
                cursorTimecode.style.left = compressedX + 'px';
                cursorTimecode.style.display = 'block';
            }

            // Continuous update function for smooth tracking during scroll
            function continuousUpdate() {
                updateCursorPosition();
                cursorUpdateAnimationId = requestAnimationFrame(continuousUpdate);
            }

            // Track mouse on timeline bar
            timelineBar._mouseMoveHandler = function(e) {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateCursorPosition();
            };

            timelineBar._mouseLeaveHandler = function() {
                lastMouseX = null;
                lastMouseY = null;
                cursorLine.style.display = 'none';
                cursorTimecode.style.display = 'none';
                if (cursorUpdateAnimationId) {
                    cancelAnimationFrame(cursorUpdateAnimationId);
                    cursorUpdateAnimationId = null;
                }
            };

            // Also track mouse on container to handle edge scrolling scenarios
            container._cursorMoveHandler = function(e) {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                const containerRect = container.getBoundingClientRect();
                const timelineRect = timelineBar.getBoundingClientRect();
                
                // Only update if mouse is over the timeline bar area
                if (e.clientY >= timelineRect.top && e.clientY <= timelineRect.bottom &&
                    e.clientX >= containerRect.left && e.clientX <= containerRect.right) {
                    updateCursorPosition();
                    // Start continuous updates if not already running
                    if (!cursorUpdateAnimationId) {
                        continuousUpdate();
                    }
                }
            };

            container._cursorLeaveHandler = function() {
                lastMouseX = null;
                lastMouseY = null;
                cursorLine.style.display = 'none';
                cursorTimecode.style.display = 'none';
                if (cursorUpdateAnimationId) {
                    cancelAnimationFrame(cursorUpdateAnimationId);
                    cursorUpdateAnimationId = null;
                }
            };

            // Update cursor position during scroll
            container._cursorScrollHandler = function() {
                if (lastMouseX !== null && lastMouseY !== null) {
                    // Start continuous updates during scroll if not already running
                    if (!cursorUpdateAnimationId) {
                        continuousUpdate();
                    }
                }
            };

            // Add listeners
            timelineBar.addEventListener('mousemove', timelineBar._mouseMoveHandler);
            timelineBar.addEventListener('mouseleave', timelineBar._mouseLeaveHandler);
            container.addEventListener('mousemove', container._cursorMoveHandler);
            container.addEventListener('mouseleave', container._cursorLeaveHandler);
            container.addEventListener('scroll', container._cursorScrollHandler);
        }

        function setupSegmentMarkers(timelineBar, totalSeconds, actualWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            segmentContainer.style.position = 'absolute';
            segmentContainer.style.top = '0';
            segmentContainer.style.left = '0';
            segmentContainer.style.width = actualWidth + 'px';
            segmentContainer.style.height = '60px';
            segmentContainer.style.pointerEvents = 'none';

            // Remove existing listeners if they exist
            if (timelineBar._rightClickHandler) {
                timelineBar.removeEventListener('contextmenu', timelineBar._rightClickHandler);
            }

            // Handle right-click to add segment
            timelineBar._rightClickHandler = function(e) {
                e.preventDefault();
                const rect = timelineBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const clampedX = Math.max(0, Math.min(x, actualWidth));
                
                // Calculate time at this position
                const timeSeconds = (clampedX / actualWidth) * totalSeconds;
                
                // Generate segment name
                const segmentName = `Seg ${String(segmentCounter).padStart(2, '0')}`;
                
                // Add segment
                addSegmentMarker(clampedX, segmentName, timeSeconds, totalSeconds, actualWidth);
                segmentCounter++;
            };

            timelineBar.addEventListener('contextmenu', timelineBar._rightClickHandler);
        }

        function addSegmentMarker(x, name, timeSeconds, totalSeconds, actualWidth) {
            const segmentContainer = document.getElementById('segmentMarkersContainer');
            
            // Create segment marker element
            const marker = document.createElement('div');
            marker.className = 'segment-marker';
            marker.style.left = x + 'px';
            marker.dataset.x = x;
            marker.dataset.name = name;
            marker.dataset.timeSeconds = timeSeconds;
            
            // Create label
            const label = document.createElement('div');
            label.className = 'segment-label';
            label.textContent = name;
            marker.appendChild(label);
            
            // Add click handler to delete
            marker.addEventListener('click', function(e) {
                e.stopPropagation();
                deleteSegmentMarker(marker);
            });
            
            // Make marker clickable
            marker.style.pointerEvents = 'auto';
            
            segmentContainer.appendChild(marker);
            
            // Store segment data
            segments.push({
                x: x,
                name: name,
                timeSeconds: timeSeconds,
                element: marker
            });
        }

        function deleteSegmentMarker(marker) {
            const name = marker.dataset.name;
            const index = segments.findIndex(seg => seg.element === marker);
            
            if (index !== -1) {
                segments.splice(index, 1);
                marker.remove();
            }
        }

        function setupAutoScroll(container) {
            const edgeZone = 60; // pixels from edge
            let scrollAnimationId = null;
            let isScrolling = false;

            // Remove existing listeners if they exist
            if (container._autoScrollMoveHandler) {
                container.removeEventListener('mousemove', container._autoScrollMoveHandler);
                container.removeEventListener('mouseleave', container._autoScrollLeaveHandler);
            }

            function calculateScrollSpeed(distanceFromEdge) {
                // Speed increases as distance decreases (closer to edge = faster)
                // Max speed when at edge (distance = 0), no speed at 60px
                const normalizedDistance = Math.max(0, Math.min(1, distanceFromEdge / edgeZone));
                const speed = (1 - normalizedDistance) * 15; // Max speed of 15 pixels per frame
                return speed;
            }

            function startScrolling(direction) {
                if (isScrolling) return;
                isScrolling = true;

                function scroll() {
                    if (!isScrolling) {
                        scrollAnimationId = null;
                        return;
                    }

                    const currentScroll = container.scrollLeft;
                    const maxScroll = container.scrollWidth - container.clientWidth;
                    
                    // Check if we can still scroll in this direction
                    if (direction === 'left' && currentScroll > 0) {
                        const rect = container.getBoundingClientRect();
                        const mouseX = container._lastMouseX - rect.left;
                        const distanceFromEdge = mouseX;
                        
                        if (distanceFromEdge < edgeZone) {
                            const speed = calculateScrollSpeed(distanceFromEdge);
                            container.scrollLeft = Math.max(0, currentScroll - speed);
                            scrollAnimationId = requestAnimationFrame(scroll);
                        } else {
                            isScrolling = false;
                            scrollAnimationId = null;
                        }
                    } else if (direction === 'right' && currentScroll < maxScroll) {
                        const rect = container.getBoundingClientRect();
                        const mouseX = container._lastMouseX - rect.left;
                        const distanceFromEdge = container.clientWidth - mouseX;
                        
                        if (distanceFromEdge < edgeZone) {
                            const speed = calculateScrollSpeed(distanceFromEdge);
                            container.scrollLeft = Math.min(maxScroll, currentScroll + speed);
                            scrollAnimationId = requestAnimationFrame(scroll);
                        } else {
                            isScrolling = false;
                            scrollAnimationId = null;
                        }
                    } else {
                        isScrolling = false;
                        scrollAnimationId = null;
                    }
                }

                scrollAnimationId = requestAnimationFrame(scroll);
            }

            function stopScrolling() {
                isScrolling = false;
                if (scrollAnimationId) {
                    cancelAnimationFrame(scrollAnimationId);
                    scrollAnimationId = null;
                }
            }

            container._autoScrollMoveHandler = function(e) {
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                container._lastMouseX = e.clientX;
                
                const distanceFromLeft = mouseX;
                const distanceFromRight = container.clientWidth - mouseX;
                
                // Check if mouse is in edge zones
                if (distanceFromLeft < edgeZone && distanceFromLeft >= 0) {
                    // Near left edge - scroll left
                    stopScrolling();
                    startScrolling('left');
                } else if (distanceFromRight < edgeZone && distanceFromRight >= 0) {
                    // Near right edge - scroll right
                    stopScrolling();
                    startScrolling('right');
                } else {
                    // Not in edge zone - stop scrolling
                    stopScrolling();
                }
            };

            container._autoScrollLeaveHandler = function() {
                stopScrolling();
            };

            container.addEventListener('mousemove', container._autoScrollMoveHandler);
            container.addEventListener('mouseleave', container._autoScrollLeaveHandler);
        }

        function setupRangeSelection(timelineBar, totalSeconds, actualWidth) {
            const rangeSelection = document.getElementById('rangeSelection');
            const rangeStartTimecode = document.getElementById('rangeStartTimecode');
            const rangeEndTimecode = document.getElementById('rangeEndTimecode');
            const container = document.getElementById('timelineContainer');

            // Remove existing listeners
            if (timelineBar._rangeMouseDown) {
                timelineBar.removeEventListener('mousedown', timelineBar._rangeMouseDown);
            }
            if (timelineBar._rangeMouseMove) {
                timelineBar.removeEventListener('mousemove', timelineBar._rangeMouseMove);
            }
            if (timelineBar._rangeMouseUp) {
                timelineBar.removeEventListener('mouseup', timelineBar._rangeMouseUp);
            }

            timelineBar._rangeMouseDown = function(e) {
                // Only start selection if not clicking on segment markers, deleted zones, or deleted regions
                if (e.target.classList.contains('segment-marker') || 
                    e.target.closest('.deleted-zone') ||
                    e.target.closest('.deleted-chunk') ||
                    e.target.dataset.deletedRegion === 'true' ||
                    e.target.closest('[data-deleted-region="true"]')) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();
                
                // Get current timeline bar width (accounts for collapsed/expanded view)
                const currentTimelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;
                const rect = timelineBar.getBoundingClientRect();
                const scrollLeft = timelineData.isExpanded ? container.scrollLeft : 0;
                
                // Calculate position relative to timeline bar (not container)
                const mouseXRelativeToTimeline = e.clientX - rect.left + scrollLeft;
                const compressedPixelX = Math.max(0, Math.min(mouseXRelativeToTimeline, currentTimelineWidth));
                
                // Convert compressed pixel position to actual time
                rangeStartTime = compressedPixelToTime(compressedPixelX, totalSeconds, currentTimelineWidth);
                
                // Check if starting in a deleted region
                if (isTimeInDeletedRegion(rangeStartTime)) {
                    return; // Don't allow selection to start in deleted region
                }
                
                // Calculate compressed pixel position for display
                rangeStartX = timeToCompressedPixel(rangeStartTime, totalSeconds, currentTimelineWidth);
                
                isSelectingRange = true;

                rangeSelection.style.display = 'block';
                rangeSelection.style.left = rangeStartX + 'px';
                rangeSelection.style.width = '0px';
                rangeStartTimecode.style.display = 'block';
                rangeStartTimecode.style.left = rangeStartX + 'px';
                rangeStartTimecode.textContent = formatTime(Math.floor(rangeStartTime));
                rangeEndTimecode.style.display = 'block';
            };

            timelineBar._rangeMouseMove = function(e) {
                if (!isSelectingRange) return;

                // Get current timeline bar width (accounts for collapsed/expanded view)
                const currentTimelineWidth = parseFloat(timelineBar.style.width) || timelineBar.offsetWidth;
                const rect = timelineBar.getBoundingClientRect();
                const scrollLeft = timelineData.isExpanded ? container.scrollLeft : 0;
                
                // Calculate position relative to timeline bar
                const mouseXRelativeToTimeline = e.clientX - rect.left + scrollLeft;
                const compressedPixelX = Math.max(0, Math.min(mouseXRelativeToTimeline, currentTimelineWidth));
                
                // Convert compressed pixel position to actual time
                currentRangeEndTime = compressedPixelToTime(compressedPixelX, totalSeconds, currentTimelineWidth);
                
                // Calculate compressed pixel positions for display
                const compressedStartX = timeToCompressedPixel(rangeStartTime, totalSeconds, currentTimelineWidth);
                const compressedEndX = timeToCompressedPixel(currentRangeEndTime, totalSeconds, currentTimelineWidth);

                const startX = Math.min(compressedStartX, compressedEndX);
                const endX = Math.max(compressedStartX, compressedEndX);
                const width = endX - startX;

                rangeSelection.style.left = startX + 'px';
                rangeSelection.style.width = width + 'px';
                rangeStartTimecode.style.left = compressedStartX + 'px';
                rangeEndTimecode.style.left = compressedEndX + 'px';
                rangeEndTimecode.textContent = formatTime(Math.floor(currentRangeEndTime));
            };

            timelineBar._rangeMouseUp = function(e) {
                if (!isSelectingRange) return;
                isSelectingRange = false;

                // Use the already calculated times (they're in actual time, not compressed)
                const inTime = Math.min(rangeStartTime, currentRangeEndTime);
                const outTime = Math.max(rangeStartTime, currentRangeEndTime);

                // Check if selection overlaps with deleted regions
                const overlapsDeleted = deleteAnnotations.some(annotation => 
                    (inTime >= annotation.inTime && inTime <= annotation.outTime) ||
                    (outTime >= annotation.inTime && outTime <= annotation.outTime) ||
                    (inTime <= annotation.inTime && outTime >= annotation.outTime)
                );

                if (overlapsDeleted) {
                    // Selection overlaps deleted region, cancel
                    rangeSelection.style.display = 'none';
                    rangeStartTimecode.style.display = 'none';
                    rangeEndTimecode.style.display = 'none';
                    return;
                }

                if (Math.abs(outTime - inTime) < 0.1) {
                    // Range too small, cancel
                    rangeSelection.style.display = 'none';
                    rangeStartTimecode.style.display = 'none';
                    rangeEndTimecode.style.display = 'none';
                    return;
                }

                // Show delete popup
                showDeletePopup(inTime, outTime);
            };

            timelineBar.addEventListener('mousedown', timelineBar._rangeMouseDown);
            timelineBar.addEventListener('mousemove', timelineBar._rangeMouseMove);
            timelineBar.addEventListener('mouseup', timelineBar._rangeMouseUp);
        }

        function showDeletePopup(inTime, outTime) {
            const popup = document.getElementById('deletePopup');
            document.getElementById('popupInTimecode').textContent = formatTime(Math.floor(inTime));
            document.getElementById('popupOutTimecode').textContent = formatTime(Math.floor(outTime));
            document.getElementById('deleteComment').value = '';
            popup.style.display = 'block';
        }

        function closeDeletePopup() {
            document.getElementById('deletePopup').style.display = 'none';
            document.getElementById('rangeSelection').style.display = 'none';
            document.getElementById('rangeStartTimecode').style.display = 'none';
            document.getElementById('rangeEndTimecode').style.display = 'none';
        }

        function saveDeleteAnnotation() {
            const comment = document.getElementById('deleteComment').value.trim();
            const inTimecode = document.getElementById('popupInTimecode').textContent;
            const outTimecode = document.getElementById('popupOutTimecode').textContent;
            
            const inTime = parseTimecode(inTimecode);
            const outTime = parseTimecode(outTimecode);

            const annotation = {
                id: Date.now(),
                inTime: inTime,
                outTime: outTime,
                inTimecode: inTimecode,
                outTimecode: outTimecode,
                comment: comment || '',
                completed: false,
                teamReply: ''
            };

            deleteAnnotations.push(annotation);
            deleteAnnotations.sort((a, b) => a.inTime - b.inTime);

            renderDeletedZones();
            renderDeletedChunks();
            updateDurationDisplay();
            closeDeletePopup();
        }

        function parseTimecode(timecode) {
            const parts = timecode.split(':').map(Number);
            return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }

        // Helper function to calculate compressed pixel position from actual time
        function timeToCompressedPixel(time, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (time / totalSeconds) * timelineWidth;
            }

            let compressedTime = 0;
            let lastTime = 0;

            // Sort annotations by inTime
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            for (const annotation of sorted) {
                if (time <= annotation.inTime) {
                    // Time is before this deletion, add the gap and return
                    compressedTime += (time - lastTime);
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Add time up to deletion start
                compressedTime += (annotation.inTime - lastTime);
                
                if (time <= annotation.outTime) {
                    // Time is within this deletion - return position at deletion start (collapsed)
                    return (compressedTime / totalSeconds) * timelineWidth;
                }
                
                // Skip over deleted region, update lastTime
                lastTime = annotation.outTime;
            }

            // Time is after all deletions
            compressedTime += (time - lastTime);
            return (compressedTime / totalSeconds) * timelineWidth;
        }

        // Helper function to convert compressed pixel position back to actual time
        function compressedPixelToTime(pixelX, totalSeconds, timelineWidth) {
            if (deleteAnnotations.length === 0) {
                return (pixelX / timelineWidth) * totalSeconds;
            }

            const compressedTime = (pixelX / timelineWidth) * totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            let actualTime = 0;
            let compressedCounter = 0;
            let lastActualTime = 0;

            for (const annotation of sorted) {
                const segmentDuration = annotation.inTime - lastActualTime;
                
                if (compressedCounter + segmentDuration >= compressedTime) {
                    // Time is in this segment
                    actualTime = lastActualTime + (compressedTime - compressedCounter);
                    return actualTime;
                }
                
                compressedCounter += segmentDuration;
                lastActualTime = annotation.outTime;
            }

            // Time is after all deletions
            actualTime = lastActualTime + (compressedTime - compressedCounter);
            return actualTime;
        }

        // Check if a time is within a deleted region
        function isTimeInDeletedRegion(time) {
            return deleteAnnotations.some(annotation => 
                time >= annotation.inTime && time <= annotation.outTime
            );
        }

        function renderCompressedTimelineBackground() {
            const background = document.getElementById('compressedTimelineBackground');
            background.innerHTML = '';
            
            if (deleteAnnotations.length === 0) {
                background.style.display = 'none';
                return;
            }

            const actualWidth = timelineData.isExpanded ? timelineData.actualWidth : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;
            const sorted = [...deleteAnnotations].sort((a, b) => a.inTime - b.inTime);

            background.style.display = 'block';
            background.style.width = actualWidth + 'px';

            let lastTime = 0;
            let currentX = 0;

            sorted.forEach((annotation, index) => {
                // Render segment before deletion
                if (annotation.inTime > lastTime) {
                    const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                    const segmentEndX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                    const segmentWidth = segmentEndX - segmentStartX;

                    if (segmentWidth > 0) {
                        const segment = document.createElement('div');
                        segment.className = 'timeline-segment';
                        segment.style.left = segmentStartX + 'px';
                        segment.style.width = segmentWidth + 'px';
                        background.appendChild(segment);
                    }
                }

                // Render gap (collapsed deletion)
                const gapStartX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const gapEndX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const gapWidth = Math.max(2, gapEndX - gapStartX);

                const gap = document.createElement('div');
                gap.className = 'timeline-gap';
                gap.style.left = gapStartX + 'px';
                gap.style.width = gapWidth + 'px';
                background.appendChild(gap);

                lastTime = annotation.outTime;
            });

            // Render final segment after last deletion
            if (lastTime < totalSeconds) {
                const segmentStartX = timeToCompressedPixel(lastTime, totalSeconds, actualWidth);
                const segmentEndX = actualWidth;
                const segmentWidth = segmentEndX - segmentStartX;

                if (segmentWidth > 0) {
                    const segment = document.createElement('div');
                    segment.className = 'timeline-segment';
                    segment.style.left = segmentStartX + 'px';
                    segment.style.width = segmentWidth + 'px';
                    background.appendChild(segment);
                }
            }
        }

        function renderDeletedZones() {
            const container = document.getElementById('deletedZonesContainer');
            container.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? timelineData.actualWidth : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;

            // Render compressed timeline background
            renderCompressedTimelineBackground();

            deleteAnnotations.forEach(annotation => {
                // Calculate compressed position for the in point
                const inX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);

                // Create non-selectable overlay zone covering the deleted region
                const compressedInX = timeToCompressedPixel(annotation.inTime, totalSeconds, actualWidth);
                const compressedOutX = timeToCompressedPixel(annotation.outTime, totalSeconds, actualWidth);
                const zoneWidth = Math.max(2, compressedOutX - compressedInX);

                // Thin red line at the in point (collapsed marker)
                const zone = document.createElement('div');
                zone.className = 'deleted-zone';
                zone.style.left = inX + 'px';
                zone.style.pointerEvents = 'auto';
                zone.dataset.annotationId = annotation.id;
                zone.dataset.inTime = annotation.inTime;
                zone.dataset.outTime = annotation.outTime;
                zone.onclick = () => openDetailPanel(annotation.id);
                container.appendChild(zone);

                // Create non-selectable overlay covering the entire deleted region
                const overlay = document.createElement('div');
                overlay.style.position = 'absolute';
                overlay.style.left = compressedInX + 'px';
                overlay.style.width = zoneWidth + 'px';
                overlay.style.top = '0';
                overlay.style.height = '60px';
                overlay.style.pointerEvents = 'auto';
                overlay.style.cursor = 'not-allowed';
                overlay.style.backgroundColor = 'transparent';
                overlay.dataset.deletedRegion = 'true';
                overlay.dataset.inTime = annotation.inTime;
                overlay.dataset.outTime = annotation.outTime;
                overlay.onclick = (e) => {
                    e.stopPropagation();
                    openDetailPanel(annotation.id);
                };
                container.appendChild(overlay);
            });
        }

        function renderDeletedChunks() {
            const strip = document.getElementById('deletedChunksStrip');
            strip.innerHTML = '';
            const actualWidth = timelineData.isExpanded ? timelineData.actualWidth : 
                (document.getElementById('timelineContainer').getBoundingClientRect().width - 40);
            const totalSeconds = timelineData.totalSeconds;
            const scale = actualWidth / timelineData.actualWidth;

            deleteAnnotations.forEach(annotation => {
                const inX = (annotation.inTime / totalSeconds) * timelineData.actualWidth * scale;
                const outX = (annotation.outTime / totalSeconds) * timelineData.actualWidth * scale;
                const width = Math.max(50, outX - inX);

                const chunk = document.createElement('div');
                chunk.className = 'deleted-chunk';
                chunk.style.left = inX + 'px';
                chunk.style.width = width + 'px';
                chunk.dataset.annotationId = annotation.id;
                
                const label = document.createElement('span');
                label.className = 'deleted-chunk-label';
                label.textContent = `${annotation.inTimecode} - ${annotation.outTimecode}`;
                
                const comment = document.createElement('span');
                comment.textContent = annotation.comment ? `: ${annotation.comment}` : '';
                
                chunk.appendChild(label);
                chunk.appendChild(comment);
                chunk.onclick = () => openDetailPanel(annotation.id);
                strip.appendChild(chunk);
            });
        }

        function updateDurationDisplay() {
            const originalDuration = timelineData.totalSeconds;
            let currentDuration = originalDuration;

            deleteAnnotations.forEach(annotation => {
                currentDuration -= (annotation.outTime - annotation.inTime);
            });

            document.getElementById('originalDuration').textContent = formatTime(Math.floor(originalDuration));
            document.getElementById('currentDuration').textContent = formatTime(Math.floor(currentDuration));
        }

        function openDetailPanel(annotationId) {
            const annotation = deleteAnnotations.find(a => a.id === annotationId);
            if (!annotation) return;

            document.getElementById('detailInTimecode').textContent = annotation.inTimecode;
            document.getElementById('detailOutTimecode').textContent = annotation.outTimecode;
            document.getElementById('detailComment').textContent = annotation.comment;
            document.getElementById('detailCompleted').checked = annotation.completed;
            document.getElementById('detailTeamReply').value = annotation.teamReply || '';

            // Store current annotation ID
            document.getElementById('detailPanel').dataset.annotationId = annotationId;

            document.getElementById('detailPanel').style.display = 'block';
        }

        function closeDetailPanel() {
            const panel = document.getElementById('detailPanel');
            const annotationId = parseInt(panel.dataset.annotationId);
            const annotation = deleteAnnotations.find(a => a.id === annotationId);

            if (annotation) {
                annotation.completed = document.getElementById('detailCompleted').checked;
                annotation.teamReply = document.getElementById('detailTeamReply').value;
            }

            panel.style.display = 'none';
        }

        // Handle window resize for collapsed view
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (!timelineData.isExpanded && timelineData.totalSeconds) {
                    applyTimelineView();
                    renderDeletedZones();
                    renderDeletedChunks();
                }
            }, 100);
        });

        // Allow Enter key to trigger draw
        document.getElementById('duration').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                drawTimeline();
            }
        });
    </script>
</body>
</html>
